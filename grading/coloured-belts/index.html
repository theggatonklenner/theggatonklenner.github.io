<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04794b">
<title>Coloured Belt Grading</title>
<link rel="icon" href="../../icons/black-belt-prep.png">
<link rel="apple-touch-icon" href="../../icons/black-belt-prep.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../config.js"></script>
<script src="../../hub-signin.js"></script>
<style>
  /* Same look as the other AMA Toolkit apps */
  :root {
    --bg: #f3f6f4; --surface: #ffffff; --fg: #16211b; --muted: #5a6b61; --line: #dfe7e2;
    --accent: #04794b; --on-accent: #ffffff; --accent-soft: #e3f2ea; --gold: #f2d500; --on-gold: #1d1d1d;
    --danger: #b3261e; --danger-soft: #fbe9e7; --warn: #8a4f00; --warn-soft: #fdf1df; --info: #1f5fa8; --info-soft: #e6eefa; --hover: #eef5f1;
    --shadow: 0 1px 2px rgba(16,33,27,.06), 0 4px 14px rgba(16,33,27,.06);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1612; --surface: #16211b; --fg: #e6efe9; --muted: #93a79b; --line: #26352c;
      --accent: #3fbf7f; --on-accent: #06150d; --accent-soft: #1b3326; --gold: #e8d23a; --on-gold: #1d1d1d;
      --danger: #f2867d; --danger-soft: #3a1d1b; --warn: #f0b45a; --warn-soft: #3a2a12; --info: #8db8f0; --info-soft: #18263a; --hover: #1c2b23;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }

  .appbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0; }
  .appbar-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
  .home-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); text-decoration: none; }
  .home-btn:hover { color: var(--accent); border-color: var(--accent); }
  .home-btn svg { width: 20px; height: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { max-width: 980px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tab { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }

  main { max-width: 980px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; }
  h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); } .small { font-size: 14px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  input[type=text], input[type=email], input[type=password], input[type=search], input[type=date], input[type=time], input[type=number], input[type=url], select, textarea { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  textarea { resize: vertical; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--danger); }
  .btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; white-space: nowrap; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }

  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .list li + li { border-top: 1px solid var(--line); }
  .item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: none; border: 0; text-align: left; cursor: pointer; min-height: 60px; }
  button.item:hover { background: var(--hover); }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .who strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .tag.ok { background: var(--accent-soft); color: var(--accent); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--danger-soft); color: var(--danger); } .tag.info { background: var(--info-soft); color: var(--info); }
  .belt { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; flex: none; }
  .empty { text-align: center; color: var(--muted); padding: 30px 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; }
  .stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
  .stat span { font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td input[type=number] { min-height: 38px; width: 90px; }
  .auth { max-width: 380px; margin: 10vh auto 0; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

  /* Results on a tablet: big buttons */
  .res { display: flex; gap: 8px; flex-wrap: wrap; }
  .res button { min-height: 54px; min-width: 110px; flex: 1; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 17px; cursor: pointer; }
  .res button[aria-pressed=true][data-r=pass] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .res button[aria-pressed=true][data-r=distinction] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .res button[aria-pressed=true][data-r=retest] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .rescard { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  dialog { border: 0; padding: 0; background: var(--surface); color: var(--fg); border-radius: 16px; width: min(640px, calc(100% - 24px)); max-height: calc(100dvh - 24px); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  @media (max-width: 600px) { dialog { margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; } }
  .dlg { padding: 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .section { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .x { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; }
  #toast { inset: auto; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); margin: 0; border: 0; width: max-content;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); box-shadow: var(--shadow); z-index: 50; }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <a class="home-btn" href="../" aria-label="Back to Grading" title="Grading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></a>
    <div class="brand"><h1>Coloured Belt Grading</h1></div>
    <button class="btn sm" id="signOut" hidden>Sign out</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" data-view="ready" aria-selected="true">Who's ready</button>
    <button class="tab" role="tab" data-view="days">Grading days</button>
    <button class="tab" role="tab" data-view="efc">Update EFC</button>
    <button class="tab" role="tab" data-view="dash">Dashboard</button>
    <button class="tab" role="tab" data-view="settings" data-admin>Settings</button>
  </nav>
</header>

<main>
  <section id="signIn" class="card auth" hidden>
    <h2>Sign in</h2>
    <p class="hint">Use your AMA login, or your hub mobile and PIN.</p>
    <form id="siForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="siEmail">Email</label><input type="email" id="siEmail" autocomplete="username" required></div>
      <div class="field"><label for="siPass">Password</label><input type="password" id="siPass" autocomplete="current-password" required></div>
      <button class="btn primary" id="siGo" type="submit">Sign in</button>
    </form>
  </section>
  <section id="noAccess" class="card" hidden><h2>No access yet</h2><p class="hint" id="noAccessText"></p></section>
  <p id="loading" class="hint">Loading…</p>

  <section id="view-ready" class="view" hidden></section>
  <section id="view-days" class="view" hidden></section>
  <section id="view-day" class="view" hidden></section>
  <section id="view-efc" class="view" hidden></section>
  <section id="view-dash" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<dialog id="dlg"></dialog>
<div id="toast" role="status" popover="manual" hidden></div>

<script>
const CFG = window.TOOLKIT_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const FN = CFG.SUPABASE_URL + '/functions/v1/cb';
// Sign in with the AMA Admin Hub mobile and PIN (hub-signin.js)
const HUB = { sb, url: CFG.SUPABASE_URL, key: CFG.SUPABASE_KEY, form: '#siForm' };
if (window.AmaHub) { AmaHub.mount(HUB); AmaHub.recheck(HUB); }

const SCHOOLS = ['Marrickville', 'Sydenham', 'Concord', 'West', 'Sylvania'];
const RESULT = { pass: 'Pass', distinction: 'Distinction', retest: 'Re-test' };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dlg = $('#dlg');
const state = { roles: [], me: '', students: [], belts: [], settings: {}, days: [], entries: [], messages: [], view: 'ready', day: null, resultsMode: false };
const has = (...r) => state.roles.includes('admin') || r.some(x => state.roles.includes(x));
const canApprove = () => has('instructor', 'grading'), canGrade = () => has('grading'), canPay = () => has('grading', 'payments'), isAdmin = () => state.roles.includes('admin');

let toastTimer;
function toast(msg, ms = 4000) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
  try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch (e) { /* older browsers */ }
  toastTimer = setTimeout(() => { t.hidden = true; try { t.hidePopover(); } catch (e) { /* ignore */ } }, ms);
}
function openDlg(html) {
  dlg.innerHTML = html;
  dlg.querySelectorAll('[data-close]').forEach(b => { b.type = 'button'; b.onclick = e => { e.preventDefault(); dlg.close(); }; });
  if (!dlg.open) dlg.showModal();
}
const errMsg = e => (e && (e.message || e.error_description || e.details)) || String(e);
async function run(q, okMsg) { const { data, error } = await q; if (error) throw error; if (okMsg) toast(okMsg); return data; }

// Dates and words
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '';
const longDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
const fmtTime = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const short = b => String(b || '').replace(/ Belt$/, '');
const money = n => n == null ? '' : '$' + Number(n).toFixed(Number(n) % 1 ? 2 : 0);
const today = () => new Date().toISOString().slice(0, 10);
const beltOf = name => state.belts.find(b => b.belt === name) || {};
const swatch = name => `<span class="belt" style="background:${esc(beltOf(name).colour || '#999')}"></span>`;
const student = key => state.students.find(s => s.member_key === key);
const dayOf = id => state.days.find(d => d.day_id === id);
const entriesOf = id => state.entries.filter(e => e.day_id === id);
const dayBelts = d => (d && d.belts && d.belts.length) ? d.belts : null;   // null: every belt
const forDay = (d, s) => s.location === d.location && (!dayBelts(d) || dayBelts(d).includes(s.belt));
const beltsText = d => dayBelts(d) ? dayBelts(d).slice().sort((a, b) => (beltOf(a).sort || 0) - (beltOf(b).sort || 0)).map(short).join(', ') : 'All belts';
const bookingLink = e => new URL('book/#t=' + e.token, location.href.replace(/[#?].*$/, '').replace(/index\.html$/, '')).href;
// Messages: fill in a template
function fill(tpl, v) {
  return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : '').replace(/\s+([.,!])/g, '$1').replace(/ {2,}/g, ' ').trim();
}
function vars(e, s, d, extra = {}) {
  return { parent: firstName(s && s.guardian_name) || 'there', first: firstName((s && s.full_name) || (e && e.full_name)), next: (e && e.belt_to) || (s && s.next_belt) || '',
    school: (d && d.location) || (s && s.location) || '', date: d ? longDate(d.grading_date) : '', time: d && d.start_time ? ' at ' + fmtTime(d.start_time) : '',
    link: e ? bookingLink(e) : '', distinction: e && e.result === 'distinction' ? ' with distinction' : '', note: (s && s.approval_note) || '', ...extra };
}
const sentTo = (kind, entryId) => state.messages.some(m => m.kind === kind && m.entry_id === entryId && (m.status === 'sent' || m.status === 'test'));

// Readiness
const overdue = s => s.weeks_at_belt != null && s.weeks_at_belt >= 2 * (s.weeks_between || 13);
const eligible = s => s.enough_classes;
const openDayFor = key => state.entries.find(e => e.member_key === key && !e.result && dayOf(e.day_id) && !dayOf(e.day_id).closed);
function readyTags(s) {
  const t = [];
  t.push(s.enough_classes ? `<span class="tag ok">${s.classes}/${s.classes_needed} classes</span>` : `<span class="tag warn">${s.classes}/${s.classes_needed} classes</span>`);
  if (s.approval === 'ready') t.push('<span class="tag ok">Ready</span>');
  else if (s.approval === 'not_yet') t.push('<span class="tag bad">Not yet</span>');
  if (overdue(s)) t.push('<span class="tag bad" title="A long time on this belt: they may be about to drop off">Overdue</span>');
  const od = openDayFor(s.member_key); if (od) { const d = dayOf(od.day_id); t.push(`<span class="tag info">${esc(fmtDate(d.grading_date).replace(/ \d{4}$/, ''))}</span>`); }
  return t.join('');
}

/* ---------------- Loading ---------------- */
async function loadAll() {
  const q = (t, order) => { let x = sb.from(t).select('*'); if (order) x = x.order(order[0], { ascending: order[1] !== false }); return x; };
  const [st, be, se, da, en, me] = await Promise.all([
    q('cb_students', ['full_name']).range(0, 9999), q('cb_belts', ['sort']), q('cb_settings'), q('cb_days', ['grading_date', false]), q('cb_entries', ['full_name']).range(0, 19999),
    sb.from('cb_messages').select('entry_id, member_key, kind, status, sent_at').order('sent_at', { ascending: false }).limit(5000)]);
  for (const r of [st, be, se, da, en]) if (r.error) throw r.error;
  state.students = st.data || []; state.belts = be.data || []; state.settings = (se.data || [])[0] || {};
  state.days = da.data || []; state.entries = en.data || []; state.messages = me.data || [];
}
function render() {
  $$('#tabs .tab').forEach(b => { b.setAttribute('aria-selected', String(b.dataset.view === (state.view === 'day' ? 'days' : state.view))); b.hidden = b.dataset.admin !== undefined && !isAdmin(); });
  $$('.view').forEach(v => v.hidden = v.id !== 'view-' + state.view);
  ({ ready: renderReady, days: renderDays, day: renderDay, efc: renderEfc, dash: renderDash, settings: renderSettings })[state.view]();
}
function go(view, day) { state.view = view; if (day) state.day = day; state.resultsMode = false; render(); window.scrollTo(0, 0); }
$$('#tabs .tab').forEach(b => b.onclick = () => go(b.dataset.view));

/* ---------------- Who's ready ---------------- */
const filt = { school: '', belt: '', show: 'eligible', q: '' };
function renderReady() {
  const v = $('#view-ready');
  if (!v.dataset.built) {
    v.dataset.built = '1';
    v.innerHTML = `<div class="view-head"><h2>Who's ready</h2><span class="hint" id="efcFresh"></span></div>
      <p class="hint">Belts and classes since each student's last grading come from EFC. A student is eligible once they have the classes their belt needs (Settings); an instructor then marks them ready or not yet.</p>
      <div class="filters">
        <select id="fSchool" aria-label="School"><option value="">All schools</option>${SCHOOLS.map(s => `<option>${s}</option>`).join('')}</select>
        <select id="fBelt" aria-label="Belt"><option value="">All belts</option></select>
        <select id="fShow" aria-label="Show"><option value="eligible">Enough classes</option><option value="ready">Marked ready</option><option value="not_yet">Marked not yet</option><option value="undecided">Enough classes, not decided</option><option value="overdue">Overdue</option><option value="all">Everyone</option></select>
        <input type="search" id="fQ" placeholder="Search name" aria-label="Search name">
      </div>
      <p class="hint" id="readyCount"></p>
      <ul class="list" id="readyList"></ul>`;
    $('#fBelt').innerHTML += state.belts.map(b => `<option value="${esc(b.belt)}">${esc(b.belt)}</option>`).join('');
    const sync = () => { filt.school = $('#fSchool').value; filt.belt = $('#fBelt').value; filt.show = $('#fShow').value; filt.q = $('#fQ').value.trim().toLowerCase(); drawReady(); };
    ['#fSchool', '#fBelt', '#fShow', '#fQ'].forEach(s => $(s).oninput = sync);
  }
  const newest = state.students.reduce((m, s) => s.efc_updated_at > m ? s.efc_updated_at : m, '');
  $('#efcFresh').textContent = newest ? 'EFC numbers from ' + new Date(newest).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
  drawReady();
}
function drawReady() {
  const show = filt.show;
  const list = state.students.filter(s => (!filt.school || s.location === filt.school) && (!filt.belt || s.belt === filt.belt) && (!filt.q || s.full_name.toLowerCase().includes(filt.q)) &&
    (show === 'all' || (show === 'eligible' && eligible(s)) || (show === 'ready' && s.approval === 'ready') || (show === 'not_yet' && s.approval === 'not_yet') ||
     (show === 'undecided' && eligible(s) && !s.approval) || (show === 'overdue' && overdue(s))))
    .sort((a, b) => a.location.localeCompare(b.location) || a.belt_sort - b.belt_sort || a.full_name.localeCompare(b.full_name));

async function fnCall(body) {
  const { data: { session } } = await sb.auth.getSession();
  let res;
  try { res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, ...(session ? { Authorization: 'Bearer ' + session.access_token } : {}) }, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Could not reach the "cb" function in Supabase.'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 404 && !data.error) throw new Error('The "cb" function is not set up in Supabase yet.');
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

  openDlg(`<div class="dlg"><div class="dlg-head"><div><h3>Add a student</h3><p class="hint">${esc(d.location)} · ${esc(beltsText(d))}</p></div><button class="x" data-close>Close</button></div>
    <input type="search" id="psQ" placeholder="Search name" aria-label="Search name"><ul class="list" id="psList" style="max-height:50vh;overflow:auto"></ul></div>`);
  const draw = () => { const q = $('#psQ').value.trim().toLowerCase();
    const l = state.students.filter(s => forDay(d, s) && (!q || s.full_name.toLowerCase().includes(q))).slice(0, 60);
    $('#psList').innerHTML = l.map(s => `<li><button class="item" data-key="${esc(s.member_key)}">${swatch(s.belt)}<div class="who"><strong>${esc(s.full_name)}</strong><span class="meta">${esc(short(s.belt))} to ${esc(short(s.next_belt))}</span></div><span class="tags">${readyTags(s)}</span></button></li>`).join('') || '<li class="empty">No one matches.</li>';
    $$('#psList [data-key]').forEach(b => b.onclick = () => addStudents(d, [student(b.dataset.key)])); };
  $('#psQ').oninput = draw; draw(); $('#psQ').focus();
}
function openEntry(id) {
  const e = state.entries.find(x => x.entry_id === id); if (!e) return;
  const d = dayOf(e.day_id), s = student(e.member_key);
  openDlg(`<div class="dlg">
    <div class="dlg-head"><div><h3>${esc(e.full_name)}</h3><p class="hint">${esc(e.belt_from)} to ${esc(e.belt_to)}</p></div><button class="x" data-close>Close</button></div>
    <dl class="kv">
      <dt>Invited</dt><dd>${e.invited_at ? new Date(e.invited_at).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' }) : 'Not yet'}</dd>
      <dt>Booked in EFC</dt><dd>${e.booked_at ? new Date(e.booked_at).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' }) : e.booking_error ? `<span style="color:var(--danger)">Failed: ${esc(e.booking_error)}</span>` : 'Not yet'}</dd>
      <dt>Fee</dt><dd>${money(beltOf(e.belt_from).fee) || 'Not set'} ${e.paid ? '<span class="tag ok">Paid</span>' : '<span class="tag warn">Unpaid</span>'}</dd>
      <dt>Result</dt><dd>${e.result ? RESULT[e.result] : '—'}</dd>
      ${s ? `<dt>Parent</dt><dd>${esc([s.guardian_name, s.phone].filter(Boolean).join(' · ') || '—')}</dd>` : ''}
    </dl>
    <div class="section"><h3>Booking link</h3><p class="hint" style="word-break:break-all">${esc(bookingLink(e))}</p><div class="row"><button class="btn sm" id="copyLink">Copy link</button></div></div>
    <div class="section"><div class="row">
      ${canPay() ? `<button class="btn" id="paidBtn">${e.paid ? 'Mark unpaid' : 'Mark paid'}</button>` : ''}
      ${canGrade() && e.booked_at ? '<button class="btn" id="unbook">Clear booking</button>' : ''}
      ${canGrade() && !e.result ? '<button class="btn danger" id="removeEntry">Take off this day</button>' : ''}</div></div>
  </div>`);
  $('#copyLink').onclick = async () => { try { await navigator.clipboard.writeText(bookingLink(e)); toast('Link copied'); } catch (er) { toast('Press and hold the link to copy it.'); } };
  const p = $('#paidBtn'); if (p) p.onclick = async () => { try { await run(sb.rpc('cb_set_paid', { p_entry: e.entry_id, p_paid: !e.paid }), e.paid ? 'Marked unpaid' : 'Marked paid'); await loadAll(); render(); openEntry(id); } catch (er) { toast(errMsg(er), 6000); } };
  const u = $('#unbook'); if (u) u.onclick = async () => { try { await run(sb.from('cb_entries').update({ booked_at: null }).eq('entry_id', e.entry_id), 'Booking cleared (cancel it in EFC too)'); await loadAll(); render(); openEntry(id); } catch (er) { toast(errMsg(er), 6000); } };
  const r = $('#removeEntry'); if (r) r.onclick = async () => { try { await run(sb.from('cb_entries').delete().eq('entry_id', e.entry_id), 'Taken off this day'); dlg.close(); await loadAll(); render(); } catch (er) { toast(errMsg(er), 6000); } };
}
// Results on a tablet: one card per student, three big buttons
function renderResults(d, es) {
  const v = $('#view-day');
  v.innerHTML = `<div class="view-head"><div><button class="x" id="backDay" style="padding:0">‹ Back to the day</button><h2>Results · ${esc(d.location)} ${esc(fmtDate(d.grading_date))}</h2></div><span class="hint" id="resCount"></span></div>
    <p class="hint">Tap a result; it saves straight away. Tap it again to clear it.</p>
    ${es.map(e => `<div class="rescard"><div class="row" style="justify-content:space-between">${swatch(e.belt_from)}<div class="who"><strong style="font-size:18px">${esc(e.full_name)}</strong><span class="meta">${esc(short(e.belt_from))} to ${esc(short(e.belt_to))}</span></div></div>
      <div class="res" data-entry="${e.entry_id}">${Object.entries(RESULT).map(([k, t]) => `<button type="button" data-r="${k}" aria-pressed="${e.result === k}">${t}</button>`).join('')}</div></div>`).join('')}`;
  const count = () => { const n = state.entries.filter(x => x.day_id === d.day_id && x.result).length; $('#resCount').textContent = `${n} of ${es.length} done`; };
  count();
  $('#backDay').onclick = () => { state.resultsMode = false; render(); };
  $$('.res[data-entry] button').forEach(b => b.onclick = async () => {
    const box = b.parentElement, id = box.dataset.entry, e = state.entries.find(x => x.entry_id === id);
    const val = e.result === b.dataset.r ? null : b.dataset.r;
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.r === val)));
    try {
      await run(sb.from('cb_entries').update({ result: val, result_at: val ? new Date().toISOString() : null, result_by: val ? state.me : null }).eq('entry_id', id));
      e.result = val; count();
    } catch (er) { toast(errMsg(er), 6000); box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.r === e.result))); }
  });
}
// Certificates: a CSV with full name, belt going for and date
function certCsv(d, list) {
  const q = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
  const date = new Date(d.grading_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  const csv = ['Full name,Belt going for,Date', ...list.map(e => [e.full_name, e.belt_to, date].map(q).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = `certificates-${d.location.toLowerCase()}-${d.grading_date}.csv`; document.body.append(a); a.click(); a.remove();
  toast(`Certificates CSV: ${list.length} ${list.length === 1 ? 'person' : 'people'}`);
}
function printDay(d, es) {
  const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print.');
  w.document.write(`<!doctype html><title>${esc(d.location)} grading ${esc(d.grading_date)}</title><style>body{font:14px Arial,sans-serif;margin:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:6px;text-align:left}</style>
    <h2>${esc(d.location)} coloured belt grading · ${esc(fmtDate(d.grading_date))} ${esc(fmtTime(d.start_time))}</h2>
    <table><tr><th>Name</th><th>From</th><th>To</th><th>Booked</th><th>Paid</th><th>Result</th></tr>${es.map(e => `<tr><td>${esc(e.full_name)}</td><td>${esc(e.belt_from)}</td><td>${esc(e.belt_to)}</td><td>${e.booked_at ? 'Yes' : ''}</td><td>${e.paid ? 'Yes' : ''}</td><td>${e.result ? RESULT[e.result] : ''}</td></tr>`).join('')}</table>`);
  w.document.close(); w.focus(); w.print();
}

/* ---------------- Update EFC (checklist) ---------------- */
function renderEfc() {
  const v = $('#view-efc');
  const todo = state.entries.filter(e => (e.result === 'pass' || e.result === 'distinction') && !e.efc_done).map(e => ({ e, d: dayOf(e.day_id) })).filter(x => x.d)
    .sort((a, b) => a.d.grading_date.localeCompare(b.d.grading_date) || a.e.full_name.localeCompare(b.e.full_name));
  const done = state.entries.filter(e => e.efc_done).sort((a, b) => String(b.efc_done_at).localeCompare(String(a.efc_done_at))).slice(0, 30);
  v.innerHTML = `<div class="view-head"><h2>Update EFC</h2></div>
    <p class="hint">EFC is the master for belts. Promote each of these students in EFC, then tick them off. The next EFC update brings the new belt back here.</p>
    <ul class="list">${todo.length ? todo.map(({ e, d }) => `<li><label class="item" style="cursor:pointer"><input type="checkbox" data-efc="${e.entry_id}" ${canGrade() ? '' : 'disabled'}>
      <div class="who"><strong>${esc(e.full_name)}</strong><span class="meta">${esc(d.location)} · ${esc(fmtDate(d.grading_date))} · ${esc(e.belt_from)} to <b>${esc(e.belt_to)}</b>${e.result === 'distinction' ? ' · distinction' : ''}</span></div></label></li>`).join('') : '<li class="empty">Nothing to update in EFC.</li>'}</ul>
    ${done.length ? `<h3>Recently done</h3><ul class="list">${done.map(e => `<li><div class="item" style="cursor:default"><div class="who"><strong>${esc(e.full_name)}</strong><span class="meta">${esc(e.belt_to)} · ${esc(e.efc_done_by || '')}</span></div>${canGrade() ? `<button class="btn sm" data-undo="${e.entry_id}">Undo</button>` : ''}</div></li>`).join('')}</ul>` : ''}`;
  $$('[data-efc]').forEach(c => c.onchange = async () => {
    try { await run(sb.from('cb_entries').update({ efc_done: true, efc_done_at: new Date().toISOString(), efc_done_by: state.me }).eq('entry_id', c.dataset.efc), 'Ticked off'); await loadAll(); render(); }
    catch (e) { c.checked = false; toast(errMsg(e), 6000); }
  });
  $$('[data-undo]').forEach(b => b.onclick = async () => { try { await run(sb.from('cb_entries').update({ efc_done: false, efc_done_at: null, efc_done_by: null }).eq('entry_id', b.dataset.undo)); await loadAll(); render(); } catch (e) { toast(errMsg(e), 6000); } });
}

/* ---------------- Dashboard ---------------- */
function renderDash() {
  const v = $('#view-dash');
  const school = v.dataset.school || '';
  const inSchool = s => !school || s === school;
  const days = state.days.filter(d => inSchool(d.location)), ids = new Set(days.map(d => d.day_id));
  const es = state.entries.filter(e => ids.has(e.day_id));
  const results = es.filter(e => e.result), passes = results.filter(e => e.result !== 'retest');
  const revenue = es.filter(e => e.paid).reduce((t, e) => t + Number(beltOf(e.belt_from).fee || 0), 0);
  const st = state.students.filter(s => inSchool(s.location));
  const od = st.filter(s => overdue(s) && !openDayFor(s.member_key));
  const ready = st.filter(s => s.approval === 'ready' && !openDayFor(s.member_key));
  const months = {}; results.forEach(e => { const d = dayOf(e.day_id); const k = d.grading_date.slice(0, 7); months[k] = months[k] || { n: 0, p: 0, r: 0 }; months[k].n++; if (e.result !== 'retest') months[k].p++; });
  es.filter(e => e.paid).forEach(e => { const k = dayOf(e.day_id).grading_date.slice(0, 7); months[k] = months[k] || { n: 0, p: 0, r: 0 }; months[k].r += Number(beltOf(e.belt_from).fee || 0); });
  const mname = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  v.innerHTML = `<div class="view-head"><h2>Dashboard</h2><select id="dashSchool" aria-label="School" style="width:auto"><option value="">All schools</option>${SCHOOLS.map(s => `<option${s === school ? ' selected' : ''}>${s}</option>`).join('')}</select></div>
    <div class="stats">
      <div class="stat"><b>${st.filter(eligible).length}</b><span>with enough classes</span></div>
      <div class="stat"><b>${ready.length}</b><span>marked ready, not on a grading day</span></div>
      <div class="stat"><b>${results.length ? Math.round(passes.length / results.length * 100) + '%' : '—'}</b><span>pass rate (${passes.length} of ${results.length})</span></div>
      <div class="stat"><b>${money(revenue) || '$0'}</b><span>grading fees paid</span></div>
      <div class="stat"><b style="color:${od.length ? 'var(--danger)' : 'inherit'}">${od.length}</b><span>overdue for a grading</span></div></div>
    <div class="card"><h3>Each month</h3>${Object.keys(months).length ? `<table><thead><tr><th>Month</th><th>Graded</th><th>Passed</th><th>Pass rate</th><th>Fees paid</th></tr></thead><tbody>${Object.keys(months).sort().reverse().map(k => `<tr><td>${esc(mname(k))}</td><td>${months[k].n}</td><td>${months[k].p}</td><td>${months[k].n ? Math.round(months[k].p / months[k].n * 100) + '%' : '—'}</td><td>${money(months[k].r)}</td></tr>`).join('')}</tbody></table>` : '<p class="hint">No results yet.</p>'}</div>
    <div class="card"><h3>Overdue for a grading</h3><p class="hint">On their belt at least twice as long as usual, and not on a grading day. A long gap is often a sign a student is about to drop off.</p>
      ${od.length ? `<ul class="list">${od.sort((a, b) => b.weeks_at_belt - a.weeks_at_belt).slice(0, 50).map(s => `<li><button class="item" data-key="${esc(s.member_key)}">${swatch(s.belt)}<div class="who"><strong>${esc(s.full_name)}</strong><span class="meta">${esc(s.location)} · ${esc(short(s.belt))} · ${s.weeks_at_belt} weeks · ${s.classes} classes</span></div></button></li>`).join('')}</ul>` : '<p class="hint">No one is overdue.</p>'}</div>`;
  $('#dashSchool').onchange = () => { v.dataset.school = $('#dashSchool').value; renderDash(); };
  $$('#view-dash [data-key]').forEach(b => b.onclick = () => openStudent(b.dataset.key));
}

/* ---------------- Settings (admins) ---------------- */
function renderSettings() {
  const v = $('#view-settings'), st = state.settings;
  v.innerHTML = `<div class="view-head"><h2>Settings</h2></div>
    <form id="beltForm" class="card"><h3>Each belt</h3>
      <p class="hint">Classes needed since their last grading (from EFC), the usual weeks between gradings (twice this is "overdue"), and the grading fee shown in invitations. EFC charges the fee through the grading session.</p>
      <div style="overflow-x:auto"><table><thead><tr><th>Belt</th><th>Grades to</th><th>Classes needed</th><th>Weeks between</th><th>Fee ($)</th></tr></thead><tbody>
      ${state.belts.map(b => `<tr data-belt="${esc(b.belt)}"><td>${swatch(b.belt)} ${esc(short(b.belt))}</td><td>${esc(short(b.next_belt))}</td>
        <td><input type="number" min="0" max="500" name="classes" value="${b.classes_needed}" aria-label="${esc(b.belt)} classes needed"></td>
        <td><input type="number" min="0" max="104" name="weeks" value="${b.weeks_between}" aria-label="${esc(b.belt)} weeks between"></td>
        <td><input type="number" min="0" step="0.01" name="fee" value="${b.fee ?? ''}" aria-label="${esc(b.belt)} fee"></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row"><button class="btn primary" type="submit" id="saveBelts">Save belts</button></div></form>
    <form id="msgForm" class="card"><h3>Messages</h3>
      <p class="hint">Fills in: {parent} {first} {next} {school} {date} {time} {link} {distinction} {note}. You can still change the wording before each send.</p>
      ${Object.keys(KIND_TPL).map(k => `<div class="field"><label for="tpl_${k}">${esc(KIND_NAME[k].replace(/ messages$/, ''))}</label><textarea id="tpl_${k}" data-col="${KIND_TPL[k]}" rows="3">${esc(st[KIND_TPL[k]] || '')}</textarea><p class="hint">${esc(KIND_HELP[k])}</p></div>`).join('')}
      <div class="field"><label for="sHook">Booking Zap (Zapier Catch Hook address)</label><input type="url" id="sHook" value="${esc(st.booking_webhook || '')}" placeholder="https://hooks.zapier.com/hooks/catch/...">
        <p class="hint">When a family presses Book, this Zap gets member_id, efc_ref, date, session_id, location_id, location, student and belt_to, and books the EFC session.</p></div>
      <div class="row"><button class="btn primary" type="submit" id="saveMsgs">Save</button><button class="btn" type="button" id="checkTexts">Check texting</button></div></form>`;
  $('#beltForm').onsubmit = async e => {
    e.preventDefault(); $('#saveBelts').disabled = true;
    try {
      for (const tr of $$('#beltForm tr[data-belt]')) {
        const val = n => tr.querySelector(`[name=${n}]`).value;
        await run(sb.from('cb_belts').update({ classes_needed: +val('classes') || 0, weeks_between: +val('weeks') || 0, fee: val('fee') === '' ? null : +val('fee'), updated_at: new Date().toISOString() }).eq('belt', tr.dataset.belt));
      }
      toast('Belts saved'); await loadAll(); render();
    } catch (er) { toast(errMsg(er), 6000); $('#saveBelts').disabled = false; }
  };
  $('#msgForm').onsubmit = async e => {
    e.preventDefault();
    const hook = $('#sHook').value.trim();
    if (hook && !/^https:\/\/hooks\.zapier\.com\//.test(hook)) return toast('The booking Zap address should start with https://hooks.zapier.com/', 6000);
    const tpl = {}; $$('#msgForm textarea[data-col]').forEach(t => { if (t.value.trim()) tpl[t.dataset.col] = t.value.trim(); });
    try { await run(sb.from('cb_settings').update({ ...tpl, booking_webhook: hook || null, updated_at: new Date().toISOString() }).eq('id', 1), 'Saved'); await loadAll(); }
    catch (er) { toast(errMsg(er), 6000); }
  };
  $('#checkTexts').onclick = async () => { try { const r = await fnCall({ action: 'check' }); toast(r.ready ? (r.testing ? 'Texting is in test mode (logged, not sent).' : 'Texting is set up.') : 'Texting is not set up: add GHL_TOKEN and GHL_LOCATION_ID in Supabase.', 6000); } catch (e) { toast(errMsg(e), 6000); } };
}

/* ---------------- Start ---------------- */
function showOnly(id) { ['#signIn', '#noAccess', '#loading'].forEach(s => $(s).hidden = s !== id); if (id) { $$('.view').forEach(v => v.hidden = true); $('#tabs').hidden = true; } }
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showOnly('#signIn'); $('#signOut').hidden = true; return; }
  $('#signOut').hidden = false;
  state.me = (session.user.email || '').toLowerCase();
  const { data: roles } = await sb.rpc('prep_my_roles');
  state.roles = roles || [];
  if (!has('instructor', 'grading', 'payments')) {
    showOnly('#noAccess');
    $('#noAccessText').textContent = `${(session.user.user_metadata || {}).full_name || state.me} can't use coloured belt grading yet. An admin can give you the Instructor, Grading or Payments role on Staff logins.`;
    return;
  }
  try { await loadAll(); }
  catch (e) { showOnly('#noAccess'); $('#noAccessText').textContent = /cb_|does not exist|schema cache/i.test(errMsg(e)) ? 'Coloured belt grading isn\'t set up in Supabase yet: run supabase/coloured-belts.sql in the SQL Editor.' : errMsg(e); return; }
  showOnly(null); $('#tabs').hidden = false;
  if (!has('instructor', 'grading')) state.view = 'days';   // payments staff: grading days (paid)
  render();
}
$('#siForm').onsubmit = async e => {
  e.preventDefault(); $('#siGo').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#siEmail').value.trim(), password: $('#siPass').value });
  $('#siGo').disabled = false;
  if (error) return toast(/invalid/i.test(error.message) ? 'Wrong email or password.' : error.message, 6000);
  start();
};
$('#signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
start();
</script>
