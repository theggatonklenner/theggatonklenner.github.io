<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04794b">
<title>Gradings</title>
<!-- Every screen has its own address (/grading/coloured-belts/grading-days ...); the site's 404.html sends those back here -->
<base href="/grading/coloured-belts/">
<link rel="icon" href="../../icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="../../icons/ama-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../config.js"></script>
<script src="../../hub-signin.js"></script>
<style>
  /* Same look as AMA ID Cards: app bar, one view at a time, tab bar at the bottom on phones. */
  :root {
    --bg: #f3f6f4; --surface: #ffffff; --fg: #16211b; --muted: #5a6b61; --line: #dfe7e2;
    --accent: #04794b; --on-accent: #ffffff; --accent-soft: #e3f2ea;
    --gold: #f2d500; --on-gold: #1d1d1d; --belt: #141414;
    --danger: #b3261e; --danger-soft: #fbe9e7; --ok: #04794b; --warn: #8a4f00; --warn-soft: #fdf0dc;
    --info: #3a4181; --info-soft: #e8eaf8; --hover: #eef5f1;
    --shadow: 0 1px 2px rgba(16,33,27,.06), 0 4px 14px rgba(16,33,27,.06);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    --tabbar-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1612; --surface: #16211b; --fg: #e6efe9; --muted: #93a79b; --line: #26352c;
      --accent: #3fbf7f; --on-accent: #06150d; --accent-soft: #1b3326;
      --gold: #e8d23a; --on-gold: #1d1d1d; --belt: #e6efe9;
      --danger: #f2867d; --danger-soft: #3a1d1a; --ok: #5cd394; --warn: #f0b45a; --warn-soft: #3a2c14;
      --info: #9aa3ea; --info-soft: #1f2340; --hover: #1c2b23;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }

  /* App bar */
  .appbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
  .appbar-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .home-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); text-decoration: none; }
  .home-btn:hover { color: var(--accent); border-color: var(--accent); }
  .home-btn svg { width: 20px; height: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand img { width: 34px; height: 34px; border-radius: 8px; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .01em; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--bg); white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; border: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .pill[data-kind="ok"] .dot { background: var(--ok); }

  /* Tabs */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tab { border: 0; background: none; padding: 8px 2px 9px; height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"] { color: var(--accent); }
  @media (min-width: 900px) {
    .tabbar { position: sticky; top: 61px; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); display: flex; justify-content: center; gap: 4px; padding: 0 16px; }
    .tab { flex-direction: row; height: 48px; padding: 0 18px; font-size: 15px; gap: 8px; border-bottom: 2px solid transparent; }
    .tab[aria-selected="true"] { border-bottom-color: var(--accent); }
    .tab svg { width: 20px; height: 20px; }
  }

  /* Views */
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
  @media (min-width: 900px) { main { padding-bottom: 48px; } }
  .view { display: flex; flex-direction: column; gap: 14px; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: .01em; }
  h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }

  /* Controls */
  label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=search], input[type=number], input[type=tel], textarea, select {
    width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; }
  textarea { resize: vertical; line-height: 1.4; min-height: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--danger); }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.big { min-height: 54px; font-size: 17px; width: 100%; }
  .btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1 1 0; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 400; color: var(--fg); min-height: 40px; cursor: pointer; }

  /* Segmented control */
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; overflow-x: auto; }
  .seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; line-height: 1.2; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .seg button small { display: block; font-weight: 400; font-size: 12px; }

  /* Lists */
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .list > li { border-top: 1px solid var(--line); }
  .list > li:first-child { border-top: 0; }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: 0; text-align: left; cursor: pointer; min-height: 60px; }
  button.item:hover { background: var(--hover); }
  .item .main { flex: 1 1 auto; min-width: 0; }
  .item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
  .tag.ok { background: var(--accent-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--danger-soft); color: var(--danger); }
  .tag.info { background: var(--info-soft); color: var(--info); }
  .tag.gold { background: var(--gold); color: var(--on-gold); }

  /* Attendance buttons */
  .att { display: flex; gap: 4px; flex: none; }
  .att button { width: 44px; height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; }
  .att button[aria-pressed="true"][data-s="present"] { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
  .att button[aria-pressed="true"][data-s="absent"]  { background: var(--danger); border-color: var(--danger); color: #fff; }
  .att button[aria-pressed="true"][data-s="excused"] { background: var(--info); border-color: var(--info); color: #fff; }
  .att .pay { margin-left: 6px; border-style: dashed; }
  .att .pay[aria-pressed="true"] { background: var(--gold); border: 1px solid var(--gold); color: var(--on-gold); }
  .att .pay:disabled { opacity: .35; cursor: default; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
  /* Quick check-in */
  .ci-search { font-size: 20px !important; min-height: 56px !important; padding: 10px 16px !important; border-radius: 14px !important; }
  .ci-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ci-big { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
  .ci-row { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 0; }
  .ci-row .item { min-height: 64px; }
  .ci-row .go { flex: none; min-width: 108px; min-height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; cursor: pointer; }
  .ci-btns { display: flex; gap: 6px; flex: none; }
  .ci-btns .go { min-width: 0; padding: 0 12px; line-height: 1.1; }
  .ci-btns .go.paid { background: var(--gold); color: var(--on-gold); }
  .ci-btns .go.unpaid { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); }
  .ci-btns .go small { display: block; font-size: 12px; font-weight: 600; }
  .ci-row .x { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer; }
  .ci-row .pay { flex: none; width: 44px; height: 40px; border-radius: 9px; border: 1px dashed var(--line); background: var(--surface); font-weight: 700; color: var(--muted); cursor: pointer; }
  .ci-row .pay[aria-pressed="true"] { background: var(--gold); border: 1px solid var(--gold); color: var(--on-gold); }
  .ci-here .name::before { content: "✓ "; color: var(--ok); }
  .owes { display: inline-block; margin-top: 3px; font-size: 13px; font-weight: 700; color: var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 2px 8px; white-space: normal; }
  .counts b { color: var(--fg); }
  .sess-cells { display: flex; gap: 3px; }
  .cell { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--bg); color: var(--muted); }
  .cell.present { background: var(--ok); color: var(--on-accent); }
  .cell.absent  { background: var(--danger); color: #fff; }
  .cell.excused { background: var(--info); color: #fff; }

  /* Selection bar */
  .selbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 19;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.08); padding: 10px 16px; }
  .selbar-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .selbar .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 6px; }
  .selbar .acts .btn { padding: 8px 4px; font-size: 14px; }
  @media (min-width: 900px) { .selbar { bottom: 0; } }
  body.selecting main { padding-bottom: calc(var(--tabbar-h) + 150px); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  .stat { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 0; text-align: left; cursor: pointer; }
  .stat .n { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.05; }
  .stat .l { font-size: 14px; color: var(--muted); }
  .stat.warn .n { color: var(--warn); }
  .stat.bad .n { color: var(--danger); }
  .belt-rule { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--belt) 0 46%, var(--gold) 46% 50%, var(--belt) 50% 100%); }

  /* Detail sections */
  .kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; margin: 0; font-size: 15px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .section { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.grid th, table.grid td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.grid th { color: var(--muted); font-weight: 600; font-size: 13px; }
  table.grid td.num, table.grid th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .preview { max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .preview table { margin: 0; }
  .preview .skip td { color: var(--muted); }

  /* Dialogs */
  dialog { border: 0; border-radius: 18px; background: var(--surface); color: var(--fg); padding: 18px; width: min(560px, calc(100% - 24px)); max-width: none; max-height: calc(100dvh - 24px); overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 20, 15, .5); }
  dialog form, dialog .body { display: flex; flex-direction: column; gap: 12px; }
  dialog p { margin: 0; }
  .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .dlg-head .x { min-height: 36px; padding: 4px 10px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: -18px; background: var(--surface); padding: 10px 0 0; margin-top: 4px; }
  @media (max-width: 640px) {
    dialog.sheet { margin: auto 0 0; width: 100%; max-height: 92dvh; border-radius: 18px 18px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    .dlg-actions { bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); }
    .dlg-actions .btn { flex: 1 1 auto; }
  }
  .checklist { max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
  .checklist .check { border-bottom: 1px solid var(--line); }
  .checklist .check:last-child { border-bottom: 0; }

  #toast { inset: auto; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px);
    z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); box-shadow: var(--shadow);
    margin: 0; border: 0; overflow: visible; width: max-content; }
  #toast[hidden] { display: none; }
  body.selecting #toast { bottom: calc(var(--tabbar-h) + 140px); }
  @media (min-width: 900px) { #toast { bottom: 24px; } }
  .auth { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
  .banner { border-radius: 12px; padding: 12px 14px; background: var(--warn-soft); color: var(--warn); font-size: 15px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

  /* What each role can see */
  body:not(.can-admin)      .need-admin,
  body:not(.can-attendance) .need-attendance { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .btn, .tab, .item, .att button { transition: background .12s, color .12s; } }
  /* ---------- AMA dark theme (matches the AMA dashboard): near-black green, gold accents, Inter ---------- */
  :root, :root:not([data-x]) {
    --bg: #070a08; --surface: #0d1511; --surface2: #0b120e; --fg: #e8efe9; --muted: #8fa697; --dim: #6f8a79; --line: #1d3326; --line2: #243f2e;
    --accent: #ffd200; --on-accent: #070a08; --accent-soft: rgba(255,210,0,.08); --gold: #ffd200; --on-gold: #070a08; --green: #1B7A3D; --belt: #000;
    --danger: #ff8f7a; --danger-soft: rgba(255,143,122,.10); --ok: #6fd39a; --warn: #ffd200; --warn-soft: rgba(255,210,0,.08);
    --info: #9fc4ad; --info-soft: rgba(159,196,173,.10); --hover: rgba(255,210,0,.04); --shadow: none;
    --font-display: Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --font-body: Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  a { color: var(--gold); }
  input[type=checkbox], input[type=radio] { accent-color: var(--gold); }
  /* App bar and tabs */
  .appbar { background: rgba(7,10,8,.94); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .brand img { width: 40px; height: 40px; border-radius: 0; object-fit: contain; }
  .brand > div { min-width: 0; }
  .brand small { display: block; font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: #9fc4ad; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 420px) { .brand small { letter-spacing: .1em; font-size: 8.5px; } .pill { max-width: 30vw; } }
  .row > .btn.grow { white-space: normal; line-height: 1.2; text-align: center; }
  .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; color: #fff; }
  .home-btn { border-color: var(--line2); color: var(--muted); background: var(--surface2); }
  .home-btn:hover { color: var(--gold); border-color: var(--gold); }
  .pill { background: var(--surface2); border: 1px solid var(--line2); color: var(--muted); }
  .pill[data-kind="ok"] .dot { background: var(--gold); }
  .tabbar { background: rgba(11,18,14,.97); border-top: 1px solid var(--line); }
  .tab { color: var(--dim); }
  .tab[aria-selected="true"] { color: var(--gold); }
  @media (min-width: 900px) { .tabbar { border-bottom: 1px solid var(--line); } .tab[aria-selected="true"] { border-bottom-color: var(--gold); } }
  /* Headings: big white titles, small gold-free uppercase section labels with a rule */
  h2 { font-weight: 800; font-size: 26px; letter-spacing: -.01em; color: #fff; }
  h3 { font-weight: 700; font-size: 16px; color: #fff; }
  .view > h3, .view > .row > h3 { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .view > h3::after, .view > .row > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .section > h3, details > summary b { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  label, .label { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .hint, .muted { color: var(--dim); }
  /* Cards, lists and the dashboard hero */
  .card, .list, .stat { background: var(--surface); border: 1px solid var(--line); box-shadow: none; }
  .card { border-radius: 16px; }
  .list { border-radius: 16px; }
  .list > li { border-top-color: var(--line); }
  #view-dashboard > .card:first-of-type { position: relative; overflow: hidden; border-radius: 20px; background: radial-gradient(120% 140% at 85% 0, #14492c 0, #0b2a1a 45%, #080f0b 100%); }

<script>
const CFG = window.TOOLKIT_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const FN = CFG.SUPABASE_URL + '/functions/v1/cb';
// Sign in with the AMA Admin Hub mobile and PIN (hub-signin.js)
const HUB = { sb, url: CFG.SUPABASE_URL, key: CFG.SUPABASE_KEY, form: '#siForm' };
if (window.AmaHub) { AmaHub.mount(HUB); AmaHub.recheck(HUB); }

const SCHOOLS = ['Marrickville', 'Sydenham', 'Concord', 'West', 'Sylvania'];
const APP_BASE = '/grading/coloured-belts/';
const RESULT = { pass: 'Pass', distinction: 'Distinction', retest: 'Re-test' };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dlg = $('#dlg');
const state = { roles: [], me: '', students: [], belts: [], settings: {}, days: [], entries: [], messages: [], view: 'ready', day: null, resultsMode: false, photosMode: false,
  all: { students: [], belts: [], days: [], entries: [] }, programmes: [], programme: (() => { try { return localStorage.getItem('cb_programme') || 'Taekwondo'; } catch (e) { return 'Taekwondo'; } })() };
const has = (...r) => state.roles.includes('admin') || r.some(x => state.roles.includes(x));
const canApprove = () => has('instructor', 'grading'), canGrade = () => has('grading'), canPay = () => has('grading', 'payments'), isAdmin = () => state.roles.includes('admin');

let toastTimer;
function toast(msg, ms = 4000) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
  try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch (e) { /* older browsers */ }
  toastTimer = setTimeout(() => { t.hidden = true; try { t.hidePopover(); } catch (e) { /* ignore */ } }, ms);
}
function openDlg(html) {
  dlg.innerHTML = html;
  dlg.querySelectorAll('[data-close]').forEach(b => { b.type = 'button'; b.onclick = e => { e.preventDefault(); dlg.close(); }; });
  if (!dlg.open) dlg.showModal();
}
const errMsg = e => (e && (e.message || e.error_description || e.details)) || String(e);
async function run(q, okMsg) { const { data, error } = await q; if (error) throw error; if (okMsg) toast(okMsg); return data; }

// Dates and words
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '';
const longDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
const fmtTime = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const short = b => String(b || '').replace(/ Belt$/, '');
const money = n => n == null ? '' : '$' + Number(n).toFixed(Number(n) % 1 ? 2 : 0);
const today = () => new Date().toISOString().slice(0, 10);
const beltOf = name => state.belts.find(b => b.belt === name) || {};
// Programs: Taekwondo, Little Dragons, Kung Fu, Kickboxing, BJJ, BJJ Kids, Tricking (from cb_programmes)
const progLabel = p => ((state.programmes || []).find(x => x.programme === p) || {}).label || p || '';
const isLD = () => /little dragon/i.test(state.programme);
// The belt someone grades to, with its program when it's another one (Little Dragons moving up to Taekwondo)
const withProg = (belt, prog) => prog && prog !== state.programme ? `${progLabel(prog)} ${belt}` : belt;
const toText = e => withProg(e.belt_to, e.to_programme);
const sNext = s => withProg(s.next_belt, s.next_programme);
const swatch = name => `<span class="belt" style="background:${esc(beltOf(name).colour || '#999')}"></span>`;
const student = key => state.students.find(s => s.member_key === key);
const dayOf = id => state.days.find(d => d.day_id === id);
const entriesOf = id => state.entries.filter(e => e.day_id === id);
const dayBelts = d => (d && d.belts && d.belts.length) ? d.belts : null;   // null: every belt
// New grading days at a school also take these schools' members (Sydenham members grade at Marrickville)
const DEFAULT_FROM = { Marrickville: ['Marrickville', 'Sydenham'] };
const defaultFrom = school => DEFAULT_FROM[school] || [school];
const daySchools = d => (d && d.schools && d.schools.length) ? d.schools : [d.location];   // whose students can grade on this day
const forDay = (d, s) => daySchools(d).includes(s.location) && (!dayBelts(d) || dayBelts(d).includes(s.belt));
const fromText = d => daySchools(d).length > 1 || daySchools(d)[0] !== d.location ? 'students from ' + daySchools(d).join(', ') : '';
const beltsText = d => dayBelts(d) ? dayBelts(d).slice().sort((a, b) => (beltOf(a).sort || 0) - (beltOf(b).sort || 0)).map(short).join(', ') : 'All belts';
const bookingLink = e => location.origin + APP_BASE + 'book/#t=' + e.token;
// A family's grading photo: a short link so the text fits in one SMS (opens photo/ with the code)
const photoLink = e => e.photo_code ? location.origin + '/p#' + e.photo_code : location.origin + APP_BASE + 'photo/#t=' + e.token;
// Messages: fill in a template
function fill(tpl, v) {
  return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : '').replace(/\s+([.,!])/g, '$1').replace(/ {2,}/g, ' ').trim();
}
function vars(e, s, d, extra = {}) {
  return { parent: firstName(s && s.guardian_name) || 'there', first: firstName((s && s.full_name) || (e && e.full_name)), next: e ? toText(e) : s ? sNext(s) : '',
    school: (d && d.location) || (s && s.location) || '', date: d ? longDate(d.grading_date) : '', time: d && d.start_time ? ' at ' + fmtTime(d.start_time) : '',
    link: e ? bookingLink(e) : '', photo: e ? photoLink(e) : '', distinction: e && e.result === 'distinction' ? ' with distinction' : '', note: (s && s.approval_note) || '', ...extra };
}
// Age and list order (youngest first by default, as gradings line up by age)
const yrs = s => s && s.age != null ? s.age : null;
const ageText = s => yrs(s) != null ? `${yrs(s)} yrs` : 'Age not in EFC';
const SORTS = { age: 'Age, youngest first', age_desc: 'Age, oldest first', belt: 'Belt, then age', name: 'Name' };
const pref = (k, d) => { try { return localStorage.getItem('cb_' + k) || d; } catch (e) { return d; } };
const savePref = (k, v) => { try { localStorage.setItem('cb_' + k, v); } catch (e) { /* private window */ } };
// Compare two people by the chosen order. s = their EFC record (for date of birth), belt = their belt now, name = full name.
function byOrder(mode) {
  const dob = x => (x.s && x.s.date_of_birth) ? String(x.s.date_of_birth).slice(0, 10) : '';
  const age = (a, b) => { const da = dob(a), db = dob(b); if (!da || !db) return (da ? -1 : db ? 1 : 0); return mode === 'age_desc' ? da.localeCompare(db) : db.localeCompare(da); };
  const belt = (a, b) => (beltOf(a.belt).sort || 99) - (beltOf(b.belt).sort || 99);
  const name = (a, b) => a.name.localeCompare(b.name);
  if (mode === 'name') return (a, b) => name(a, b);
  if (mode === 'belt') return (a, b) => belt(a, b) || age(a, b) || name(a, b);
  return (a, b) => age(a, b) || name(a, b);
}
const sortStudents = (list, mode) => list.map(s => ({ s, belt: s.belt, name: s.full_name })).sort(byOrder(mode)).map(x => x.s);
const sortEntries = (list, mode) => list.map(e => ({ e, s: student(e.member_key), belt: e.belt_from, name: e.full_name })).sort(byOrder(mode)).map(x => x.e);
const sentTo = (kind, entryId) => state.messages.some(m => m.kind === kind && m.entry_id === entryId && (m.status === 'sent' || m.status === 'test'));

// Readiness
const overdue = s => s.weeks_at_belt != null && s.weeks_at_belt >= 2 * (s.weeks_between || 13);
const eligible = s => s.enough_classes;
const openDayFor = key => state.entries.find(e => e.member_key === key && !e.result && dayOf(e.day_id) && !dayOf(e.day_id).closed);
function readyTags(s) {
  const t = [];
  t.push(s.enough_classes ? `<span class="tag ok">${s.classes}/${s.classes_needed} classes</span>` : `<span class="tag warn">${s.classes}/${s.classes_needed} classes</span>`);
  if (s.approval === 'ready') t.push('<span class="tag ok">Ready</span>');

/* ---------------- Loading ---------------- */
async function loadAll() {
  const q = (t, order) => { let x = sb.from(t).select('*'); if (order) x = x.order(order[0], { ascending: order[1] !== false }); return x; };
  // Supabase sends at most 1,000 rows at a time: fetch long lists page by page (every program together is well over 1,000 students)
  const all = async (t, orders) => {
    const rows = [];
    for (let from = 0; from < 100000; from += 1000) {
      let x = sb.from(t).select('*'); for (const o of orders) x = x.order(o, { ascending: true });
      const r = await x.range(from, from + 999);
      if (r.error) return r;
      rows.push(...(r.data || []));
      if ((r.data || []).length < 1000) break;
    }
    return { data: rows, error: null };
  };
  const [st, be, se, da, en, me, pr, lr] = await Promise.all([
    all('cb_students', ['full_name', 'member_key', 'programme']), q('cb_belts', ['sort']), q('cb_settings'), q('cb_days', ['grading_date', false]), all('cb_entries', ['full_name', 'entry_id']),
    sb.from('cb_messages').select('entry_id, member_key, kind, status, sent_at').order('sent_at', { ascending: false }).limit(5000), q('cb_programmes', ['sort']),
    sb.from('cb_efc_runs').select('ran_at').order('ran_at', { ascending: false }).limit(1)]);
  // When EFC last updated (the nightly update); missing before coloured-belts-6.sql
  state.efcAt = !lr.error && lr.data && lr.data[0] ? lr.data[0].ran_at : null;
  for (const r of [st, be, se, da, en]) if (r.error) throw r.error;
  state.all = { students: st.data || [], belts: be.data || [], days: da.data || [], entries: en.data || [] };
  state.programmes = pr.error || !(pr.data || []).length ? [{ programme: 'Taekwondo', label: 'Taekwondo', active: true }] : pr.data.filter(x => x.active !== false);
  state.settings = (se.data || [])[0] || {}; state.messages = me.data || [];
  if (!state.programmes.some(x => x.programme === state.programme)) state.programme = state.programmes[0].programme;
  applyProgramme();
}

// SMS length: 160 characters is one text (70 if it has characters like é, curly quotes or emoji); longer texts go in parts
function smsParts(t) {
  const gsm = /^[A-Za-z0-9 @£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ!"#¤%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\\\[~\]|€]*$/.test(t);
  const len = gsm ? [...t].reduce((n, c) => n + ('^{}\\[~]|€'.includes(c) ? 2 : 1), 0) : [...t].length;
  const one = gsm ? 160 : 70, many = gsm ? 153 : 67;
  return { len, gsm, one, parts: len <= one ? 1 : Math.ceil(len / many) };
}
function smsInfo(texts) {
  const el = $('#txLen'); if (!el) return;
  if (!texts.length) { el.textContent = ''; return; }
  const all = texts.map(smsParts), worst = all.reduce((a, b) => (b.parts > a.parts || (b.parts === a.parts && b.len > a.len) ? b : a));
  const over = all.filter(x => x.parts > 1).length;
  el.style.color = over ? 'var(--danger)' : '';
  el.textContent = over
    ? `Longest: ${worst.len} characters, ${worst.parts} SMS parts. ${over} of ${texts.length} won't fit in one SMS (${worst.one} characters${worst.gsm ? '' : ': a name or symbol like é or ’ lowers the limit'}). Shorten the wording to keep it to one.`
    : `Longest: ${worst.len} of ${worst.one} characters. Every text fits in one SMS.`;
}
async function fnCall(body) {

  catch (e) { throw new Error('Could not reach the "cb" function in Supabase.'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 404 && !data.error) throw new Error('The "cb" function is not set up in Supabase yet.');
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function addStudents(d, list) {

  const add = list.filter(s => !have.has(s.member_key) && !openDayFor(s.member_key) && !passedWaiting(s));

const PHOTO_BUCKET = 'grading-photos';
// Make the photo a sensible size (phones take 10+ MB photos): a JPEG at most 2400px on its long side
async function shrinkPhoto(file, max = 2400) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
    if (blob) return blob;
  } catch (e) { /* fall back to the file as it is */ }
  if (/^image\/(jpeg|png|webp)$/.test(file.type) && file.size <= 15 * 1024 * 1024) return file;
  throw new Error('This photo could not be read. Try taking it again.');
}

const squash = h => String(h || '').toLowerCase().replace(/[^a-z0-9]/g, '');
// A small CSV reader (quotes, commas and new lines inside quotes)
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = String(text).replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(x => String(x).trim())).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}
// Dates as YYYY-MM-DD from 2019-06-07, 7/6/2019 (Australian day first), 7 Jun 2019 or an Excel date number
function isoDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10);
  const t = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(t);
  if (m) { const y = m[3].length === 2 ? (Number(m[3]) > 30 ? '19' : '20') + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  const d = new Date(t); return isNaN(d) ? '' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// EFC belt names, matched to the belts set up here ("Yellow" or "yellow belt" -> "Yellow Belt", "Red 2" -> "Red Two Belt")
function beltName(v, prog = state.programme) {
  const t = String(v || '').trim(); if (!t) return '';
  const k = x => squash(x).replace(/belt$/, '').replace(/2/g, 'two').replace(/3/g, 'three');
  const hit = state.all.belts.filter(b => (b.programme || 'Taekwondo') === prog).find(b => k(b.belt) === k(t));
  return hit ? hit.belt : t;
}
// EFC program names (or close) to the programs graded here; null for ones that aren't (e.g. Mini Dragons, clubs)
function progName(v) {
  const t = String(v || '').trim(); if (!t) return null;
  const exact = state.programmes.find(x => [x.programme, x.label].some(n => n.toLowerCase() === t.toLowerCase()));
  if (exact) return exact.programme;
  const has = p => state.programmes.some(x => x.programme === p) ? p : null;
  if (/mini dragon|club|team|leadership/i.test(t)) return null;
  if (/little dragon/i.test(t)) return has('Taekwondo - Little Dragon');
  if (/bjj.*kid|kid.*bjj/i.test(t)) return has('BJJ Kids');
  if (/bjj|jiu/i.test(t)) return has('BJJ');
  if (/kick/i.test(t)) return has('Kick Boxing');
  if (/kung/i.test(t)) return has('Kung Fu');
  if (/trick/i.test(t)) return has('Tricking');
  if (/taekwondo|tkd/i.test(t)) return has('Taekwondo');

}
function schoolName(v) {
  const t = String(v || '').trim(); if (!t) return '';

}
// Turn a file's rows into import rows; returns { rows, used, unknown, skipped }
function mapImport(raw, school) {
  const heads = Object.keys(raw[0] || {});
  const col = {}, used = [];
  for (const [f, names] of Object.entries(IMPORT_COLS)) {
    const h = heads.find(x => names.includes(squash(x)));
    if (h && !Object.values(col).includes(h)) { col[f] = h; used.push(`${IMPORT_LABEL[f]} ← ${h}`); }
  }
  const unknown = heads.filter(h => !Object.values(col).includes(h));
  const get = (r, f) => col[f] != null ? r[col[f]] : '';
  const rows = [], other = [];
  for (const r of raw) {
    const progRaw = String(get(r, 'programme') || '').trim();
    const prog = progRaw ? progName(progRaw) : state.programme;   // no program column: the program chosen at the top
    if (!prog) { other.push(r); continue; }   // Mini Dragons, clubs and other programs aren't graded here
    const parent = String(get(r, 'guardian_name') || '').trim() || [get(r, 'contact_first'), get(r, 'contact_last')].map(x => String(x || '').trim()).filter(Boolean).join(' ');
    const num = v => { const n = parseInt(String(v ?? '').replace(/[^\d]/g, ''), 10); return isNaN(n) ? '' : n; };
    rows.push({ member_id: String(get(r, 'member_id') || '').trim(), reference: String(get(r, 'reference') || '').trim(),
      first_name: String(get(r, 'first_name') || '').trim(), last_name: String(get(r, 'last_name') || '').trim(), full_name: String(get(r, 'full_name') || '').trim(),
      dob: isoDate(get(r, 'dob')), belt: beltName(get(r, 'belt'), prog), location: schoolName(get(r, 'location')) || school || '',
      programme: prog, status: String(get(r, 'status') || '').trim(), phone: String(get(r, 'phone') || '').trim(), email: String(get(r, 'email') || '').trim(),
      guardian_name: parent, promoted_on: isoDate(get(r, 'promoted_on')), classes: num(get(r, 'classes')), attendance_total: num(get(r, 'attendance_total')), last_attended: isoDate(get(r, 'last_attended')) });
  }

}
async function readImportFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.json')) {
    const j = JSON.parse(await file.text());
    const list = Array.isArray(j) ? j : (j.results || j.data || []);
    return list.map(x => (x && x.member) ? { ...x, ...x.member } : x).map(x => { const o = { ...x }; delete o.member; return o; });
  }
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    if (!window.XLSX) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('Could not load the Excel reader. Save the file as CSV and try again.')); document.head.append(sc); });
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
  }
  return parseCsv(await file.text());
}

      go.disabled = true; const tot = { updated: 0, added: 0, skipped: 0 };
      try {
        for (let i = 0; i < m.rows.length; i += 800) {
          go.textContent = `Importing ${Math.min(i + 800, m.rows.length)} of ${m.rows.length}…`;
          const r = await run(sb.rpc('cb_import_efc', { p_rows: m.rows.slice(i, i + 800) }));
          for (const k in tot) tot[k] += (r && r[k]) || 0;
        }
        toast(`EFC list imported: ${tot.updated} updated, ${tot.added} added${tot.skipped ? `, ${tot.skipped} skipped (no name or EFC ref)` : ''}`, 8000);
        await loadAll(); render();
      } catch (e) { toast(errMsg(e), 8000); go.disabled = false; go.textContent = `Import ${m.rows.length}`; }
    };
  };
  f.onchange = async () => {
    raw = null; $('#impPrev').innerHTML = f.files[0] ? '<p class="hint">Reading…</p>' : '';
    if (!f.files[0]) return;
    try { raw = await readImportFile(f.files[0]); if (!raw.length) throw new Error('No rows found in that file.'); show(); }
    catch (e) { $('#impPrev').innerHTML = `<p class="hint" style="color:var(--danger)">${esc(errMsg(e))}</p>`; }
  };
  $('#impSchool').onchange = show;
}

/* ---------------- Dashboard ---------------- */
function renderDash() {
  const v = $('#view-dash');
  const school = v.dataset.school || '';
  const inSchool = s => !school || s === school;
  const days = state.days.filter(d => inSchool(d.location)), ids = new Set(days.map(d => d.day_id));
  const es = state.entries.filter(e => ids.has(e.day_id));
  const results = es.filter(e => e.result), passes = results.filter(e => e.result !== 'retest');
  const revenue = es.filter(e => e.paid).reduce((t, e) => t + Number(beltOf(e.belt_from).fee || 0), 0);
  const st = state.students.filter(s => inSchool(s.location));
  const od = st.filter(s => overdue(s) && !openDayFor(s.member_key));
  const ready = st.filter(s => s.approval === 'ready' && !openDayFor(s.member_key));
  const months = {}; results.forEach(e => { const d = dayOf(e.day_id); const k = d.grading_date.slice(0, 7); months[k] = months[k] || { n: 0, p: 0, r: 0 }; months[k].n++; if (e.result !== 'retest') months[k].p++; });
  es.filter(e => e.paid).forEach(e => { const k = dayOf(e.day_id).grading_date.slice(0, 7); months[k] = months[k] || { n: 0, p: 0, r: 0 }; months[k].r += Number(beltOf(e.belt_from).fee || 0); });
  const mname = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  v.innerHTML = `<div class="view-head"><h2>Dashboard</h2><select id="dashSchool" aria-label="School" style="width:auto"><option value="">All schools</option>${SCHOOLS.map(s => `<option${s === school ? ' selected' : ''}>${s}</option>`).join('')}</select></div>
    <div class="stats">
      <div class="stat"><span class="n">${st.filter(eligible).length}</span><span class="l">with enough classes</span></div>
      <div class="stat"><span class="n">${ready.length}</span><span class="l">marked ready, not on a grading day</span></div>
      <div class="stat"><span class="n">${results.length ? Math.round(passes.length / results.length * 100) + '%' : '—'}</span><span class="l">pass rate (${passes.length} of ${results.length})</span></div>
      <div class="stat"><span class="n">${money(revenue) || '$0'}</span><span class="l">grading fees paid</span></div>
      <div class="stat"><span class="n" style="color:${od.length ? 'var(--danger)' : 'inherit'}">${od.length}</span><span class="l">overdue for a grading</span></div></div>
    <div class="card"><h3>Each month</h3>${Object.keys(months).length ? `<table class="grid"><thead><tr><th>Month</th><th>Graded</th><th>Passed</th><th>Pass rate</th><th>Fees paid</th></tr></thead><tbody>${Object.keys(months).sort().reverse().map(k => `<tr><td>${esc(mname(k))}</td><td>${months[k].n}</td><td>${months[k].p}</td><td>${months[k].n ? Math.round(months[k].p / months[k].n * 100) + '%' : '—'}</td><td>${money(months[k].r)}</td></tr>`).join('')}</tbody></table>` : '<p class="hint">No results yet.</p>'}</div>
    <div class="card"><h3>Overdue for a grading</h3><p class="hint">On their belt at least twice as long as usual, and not on a grading day. A long gap is often a sign a student is about to drop off.</p>
      ${od.length ? `<ul class="list">${od.sort((a, b) => b.weeks_at_belt - a.weeks_at_belt).slice(0, 50).map(s => `<li><button class="item" data-key="${esc(s.member_key)}">${swatch(s.belt)}<div class="main"><div class="name">${esc(s.full_name)}</div><div class="meta">${esc(s.location)} · ${esc(short(s.belt))} · ${s.weeks_at_belt} weeks · ${s.classes} classes</div></div></button></li>`).join('')}</ul>` : '<p class="hint">No one is overdue.</p>'}</div>`;
  $('#dashSchool').onchange = () => { v.dataset.school = $('#dashSchool').value; renderDash(); };
  $$('#view-dash [data-key]').forEach(b => b.onclick = () => openStudent(b.dataset.key));
}

/* ---------------- Settings (admins) ---------------- */
function renderSettings() {
  const v = $('#view-settings'), st = state.settings;
  v.innerHTML = `<div class="view-head"><h2>Settings</h2></div>
    <form id="beltForm" class="card"><h3>Each belt: ${esc(progLabel(state.programme))}</h3>
      <p class="hint">Classes needed since their last grading (from EFC), the usual weeks between gradings (twice this is "overdue"), and the grading fee shown in invitations. EFC charges the fee through the grading session.</p>
      <div style="overflow-x:auto"><table class="grid"><thead><tr><th>Belt</th><th>Grades to</th><th>Classes needed</th><th>Weeks between</th><th>Fee ($)</th></tr></thead><tbody>
      ${state.belts.map(b => `<tr data-belt="${esc(b.belt)}"><td>${swatch(b.belt)} ${esc(short(b.belt))}</td><td>${esc(short(withProg(b.next_belt, b.next_programme)))}${b.up_belt && b.up_belt !== b.next_belt ? ' (moving up: ' + esc(withProg(b.up_belt, b.up_programme)) + ')' : ''}</td>
        <td><input type="number" min="0" max="500" name="classes" value="${b.classes_needed}" aria-label="${esc(b.belt)} classes needed"></td>
        <td><input type="number" min="0" max="104" name="weeks" value="${b.weeks_between}" aria-label="${esc(b.belt)} weeks between"></td>
        <td><input type="number" min="0" step="0.01" name="fee" value="${b.fee ?? ''}" aria-label="${esc(b.belt)} fee"></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row"><button class="btn primary" type="submit" id="saveBelts">Save belts</button></div></form>
    <form id="msgForm" class="card"><h3>Messages</h3>
      <p class="hint">Fills in: {parent} {first} {next} {school} {date} {time} {link} {photo} {distinction} {note}. You can still change the wording before each send.</p>
      ${Object.keys(KIND_TPL).map(k => `<div class="field"><label for="tpl_${k}">${esc(KIND_NAME[k].replace(/ messages$/, ''))}</label><textarea id="tpl_${k}" data-col="${KIND_TPL[k]}" rows="3">${esc(st[KIND_TPL[k]] || '')}</textarea><p class="hint">${esc(KIND_HELP[k])}</p></div>`).join('')}
      <div class="field"><label for="sHook">Booking Zap (Zapier Catch Hook address)</label><input type="url" id="sHook" value="${esc(st.booking_webhook || '')}" placeholder="https://hooks.zapier.com/hooks/catch/...">
        <p class="hint">Make a Zap: trigger "Webhooks by Zapier: Catch Hook", action "EFC Aquila: Book Session" with Location = location_id, Date = date, Member ID = member_id, Session = session_id (use "Custom" for each). Turn it on and paste the hook address here. It runs when a family pays by card or presses Book.</p></div>
      <div class="row"><button class="btn primary" type="submit" id="saveMsgs">Save</button><button class="btn" type="button" id="checkTexts">Check texting</button></div></form>`;
  $('#beltForm').onsubmit = async e => {
    e.preventDefault(); $('#saveBelts').disabled = true;
    try {
      for (const tr of $$('#beltForm tr[data-belt]')) {
        const val = n => tr.querySelector(`[name=${n}]`).value;
        await run(sb.from('cb_belts').update({ classes_needed: +val('classes') || 0, weeks_between: +val('weeks') || 0, fee: val('fee') === '' ? null : +val('fee'), updated_at: new Date().toISOString() }).eq('belt', tr.dataset.belt).eq('programme', state.programme));
      }
      toast('Belts saved'); await loadAll(); render();
    } catch (er) { toast(errMsg(er), 6000); $('#saveBelts').disabled = false; }
  };
  $('#msgForm').onsubmit = async e => {
    e.preventDefault();
    const hook = $('#sHook').value.trim();
    if (hook && !/^https:\/\/hooks\.zapier\.com\//.test(hook)) return toast('The booking Zap address should start with https://hooks.zapier.com/', 6000);
    const tpl = {}; $$('#msgForm textarea[data-col]').forEach(t => { if (t.value.trim()) tpl[t.dataset.col] = t.value.trim(); });
    try { await run(sb.from('cb_settings').update({ ...tpl, booking_webhook: hook || null, updated_at: new Date().toISOString() }).eq('id', 1), 'Saved'); await loadAll(); }
    catch (er) { toast(errMsg(er), 6000); }
  };
  $('#checkTexts').onclick = async () => { try { const r = await fnCall({ action: 'check' }); toast(r.ready ? (r.testing ? 'Texting is in test mode (logged, not sent).' : 'Texting is set up.') : 'Texting is not set up: add GHL_TOKEN and GHL_LOCATION_ID in Supabase.', 6000); } catch (e) { toast(errMsg(e), 6000); } };
}

/* ---------------- Start ---------------- */
function showOnly(id) { ['#signIn', '#noAccess', '#loading'].forEach(s => $(s).hidden = s !== id); if (id) { $$('.view').forEach(v => v.hidden = true); $('#tabs').hidden = true; } }
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showOnly('#signIn'); $('#signOut').hidden = true; return; }
  $('#signOut').hidden = false;
  state.me = (session.user.email || '').toLowerCase();
  const { data: roles } = await sb.rpc('prep_my_roles');
  state.roles = roles || [];
  if (!has('instructor', 'grading', 'payments')) {
    showOnly('#noAccess');
    $('#noAccessText').textContent = `${(session.user.user_metadata || {}).full_name || state.me} can't use gradings yet. An admin can give you the Instructor, Grading or Payments role on Staff logins.`;
    return;
  }
  try { await loadAll(); }
  catch (e) { showOnly('#noAccess'); $('#noAccessText').textContent = /cb_|does not exist|schema cache/i.test(errMsg(e)) ? 'Gradings aren\'t set up in Supabase yet: run supabase/coloured-belts.sql (then -2 to -5, in order) in the SQL Editor.' : errMsg(e); return; }
  showOnly(null); $('#tabs').hidden = false;
  if (!has('instructor', 'grading')) state.view = 'days';   // payments staff: grading days (paid)
  // The address they opened (or were sent back with from 404.html as ?p=...)
  const asked = new URLSearchParams(location.search).get('p') || (location.pathname.startsWith(APP_BASE) ? location.pathname.slice(APP_BASE.length) : '');
  applyPath(asked.replace(/^index\.html$/, ''));
  state.loaded = true;
  setAddress(true);
  render();
}
$('#siForm').onsubmit = async e => {
  e.preventDefault(); $('#siGo').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#siEmail').value.trim(), password: $('#siPass').value });
  $('#siGo').disabled = false;
  if (error) return toast(/invalid/i.test(error.message) ? 'Wrong email or password.' : error.message, 6000);
  start();
};
$('#signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
start();
</script>
</body>
