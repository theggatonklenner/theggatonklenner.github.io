<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04794b">
<title>Book a Grading</title>
<link rel="icon" href="../../../icons/ama-id-cards.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="../../../config.js"></script>
<style>
  :root {
    --bg: #f3f6f4; --surface: #ffffff; --fg: #16211b; --muted: #5a6b61; --line: #dfe7e2;
    --accent: #04794b; --on-accent: #ffffff; --accent-soft: #e3f2ea; --danger: #b3261e;
    --shadow: 0 1px 2px rgba(16,33,27,.06), 0 4px 14px rgba(16,33,27,.06);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1612; --surface: #16211b; --fg: #e6efe9; --muted: #93a79b; --line: #26352c; --accent: #3fbf7f; --on-accent: #06150d; --accent-soft: #1b3326; --danger: #f2867d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
  [hidden] { display: none !important; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: var(--font-display); font-size: 28px; margin: 0; line-height: 1.15; }
  .brand { font-family: var(--font-display); font-weight: 700; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
  .btn { min-height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .hint { color: var(--muted); font-size: 15px; margin: 0; }
  .done { background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 14px; font-weight: 700; }
  .err { color: var(--danger); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand">Australian Martial Arts</div>
    <p id="loading" class="hint">Loading…</p>
    <div id="info" hidden style="display:flex;flex-direction:column;gap:14px">
      <h1 id="title"></h1>
      <dl id="details"></dl>
      <p class="hint" id="feeNote"></p>
      <button class="btn" id="book">Book this grading</button>
      <div class="done" id="booked" hidden></div>
    </div>
    <p class="err" id="error" hidden></p>
  </div>
</main>
<script>
// A family's booking link from a coloured belt grading invitation: /grading/coloured-belts/book/#t=<token>
const CFG = window.TOOLKIT_CONFIG || {};
const $ = s => document.querySelector(s);
const token = new URLSearchParams(location.hash.replace(/^#/, '')).get('t') || '';
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function call(action) {
  const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/cb', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY }, body: JSON.stringify({ action, token }) });
  return r.json().catch(() => ({ ok: false, error: 'Something went wrong. Please try again.' }));
}
function show(r) {
  $('#loading').hidden = true;
  if (!r.first) { $('#error').textContent = r.error || 'This link isn\'t valid. Ask the front desk for a new one.'; $('#error').hidden = false; return; }
  $('#info').hidden = false;
  $('#title').textContent = `${r.first}'s grading for ${r.belt_to}`;
  $('#details').innerHTML = `<dt>When</dt><dd>${esc(fmtDate(r.date))}${r.time ? ', ' + esc(fmtTime(r.time)) : ''}</dd><dt>Where</dt><dd>AMA ${esc(r.school)}</dd>${r.fee != null ? `<dt>Fee</dt><dd>$${esc(Number(r.fee).toFixed(r.fee % 1 ? 2 : 0))}</dd>` : ''}`;
  $('#feeNote').textContent = r.booked ? '' : 'Booking adds the grading to your EFC account, where the fee is charged.';
  $('#book').hidden = !!r.booked || !!r.closed;
  $('#booked').hidden = !r.booked;
  $('#booked').textContent = `Booked. See you on ${fmtDate(r.date).split(',')[0]}!`;
  if (r.closed && !r.booked) { $('#error').textContent = 'This grading has finished.'; $('#error').hidden = false; }
  if (r.error && r.first) { $('#error').textContent = r.error; $('#error').hidden = false; }
}
$('#book').onclick = async () => {
  $('#book').disabled = true; $('#book').textContent = 'Booking…'; $('#error').hidden = true;
  const r = await call('book');
  $('#book').disabled = false; $('#book').textContent = 'Book this grading';
  show(r);
};
(async () => { if (!token) return show({ error: 'This link is missing its code. Open it from the text message you were sent.' }); show(await call('info')); })();
</script>
</body>
</html>
