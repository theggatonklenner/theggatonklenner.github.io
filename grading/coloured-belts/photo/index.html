<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1713">
<title>Grading Photo</title>
<link rel="icon" href="../../../icons/ama-id-cards.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script src="../../../config.js"></script>
<style>
  /* Same look as AMA Gradings */
  :root {
    --bg: #0f1713; --panel: #15201a; --line: #253629; --line2: #31473a; --text: #edf2ee; --sub: #a3b5a9; --gold: #f5c518; --on-gold: #14130a; --red: #ef8a73;
    --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif; --body: Barlow, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px 48px; }
  .card { display: flex; flex-direction: column; gap: 14px; }
  h1 { font: 700 32px/1.05 var(--display); margin: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--display); margin-bottom: 8px; }
  .brand img { width: 40px; height: 40px; object-fit: contain; }
  .photo { width: 100%; height: auto; border-radius: 12px; display: block; background: var(--panel); border: 1px solid var(--line); }
  .btn { min-height: 56px; border-radius: 12px; border: 0; background: var(--gold); color: var(--on-gold); font: 700 18px var(--body); cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn:disabled { opacity: .6; cursor: default; }
  .hint { color: var(--sub); font-size: 15px; margin: 0; }
  .err { color: var(--red); margin: 0; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand"><img src="../../../icons/ama-logo.png" alt="">Australian Martial Arts Academy</div>
    <p id="loading" class="hint">Loading…</p>
    <div id="info" hidden style="display:flex;flex-direction:column;gap:14px">
      <h1 id="title"></h1>
      <p class="hint" id="sub"></p>
      <img id="img" class="photo" alt="" hidden>
      <button class="btn" id="save" hidden>Save photo</button>
      <p class="hint" id="tip" hidden>On a phone, you can also press and hold the photo to save it. Please save it now: grading photos are removed 30 days after they're taken.</p>
    </div>
    <p class="err" id="error" hidden></p>
  </div>
</main>
<script>
// A family's grading photo from the Grandmaster photo text: /p#<code> (sent here as photo/#c=<code>), or photo/#t=<token>
const CFG = window.TOOLKIT_CONFIG || {};
const $ = s => document.querySelector(s);
// The short code from theggatonklenner.github.io/p#<code> (c=), or the entry's full code (t=)
const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
const token = hp.get('t') || '', code = hp.get('c') || '';
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
async function call() {
  try {
    const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/cb', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY }, body: JSON.stringify({ action: 'photo', ...(code ? { code } : { token }) }) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'Something went wrong. Please try again.' }; }
}
let photo = null;
function show(r) {
  $('#loading').hidden = true;
  if (!r.first) { $('#error').textContent = r.error || 'This link isn\'t valid. Ask the front desk for a new one.'; $('#error').hidden = false; return; }
  photo = r;
  $('#info').hidden = false;
  $('#title').textContent = `${r.first}'s grading photo`;
  $('#sub').textContent = [r.belt_to ? `Congratulations on your ${r.belt_to}!` : '', r.date ? `AMA ${r.school || ''}, ${fmtDate(r.date)}` : ''].filter(Boolean).join(' ');
  if (r.photo) {
    $('#img').src = r.url; $('#img').alt = `${r.first} with the Grandmaster`; $('#img').hidden = false;
    $('#save').hidden = false; $('#tip').hidden = false;
  }
  if (r.error) { $('#error').textContent = r.error; $('#error').hidden = false; }
}
// Save: the share sheet on phones (Save Image puts it in Photos); a download everywhere else
$('#save').onclick = async () => {
  if (!photo) return;
  $('#save').disabled = true;
  try {
    if (navigator.canShare) {
      const blob = await (await fetch(photo.url)).blob();
      const file = new File([blob], photo.filename || 'AMA-grading.jpg', { type: blob.type || 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: `${photo.first}'s grading photo` }); return; }
    }
    location.href = photo.download;
  } catch (e) { if (e && e.name !== 'AbortError') location.href = photo.download; }
  finally { $('#save').disabled = false; }
};
(async () => { if (!token && !code) return show({ error: 'This link is missing its code. Open it from the text message you were sent.' }); show(await call()); })();
</script>
</body>
</html>
