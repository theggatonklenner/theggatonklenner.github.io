<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04794b">
<title>Grading Photo</title>
<link rel="icon" href="../../../icons/black-belt-prep.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="../../../config.js"></script>
<style>
  :root {
    --bg: #f3f6f4; --surface: #ffffff; --fg: #16211b; --muted: #5a6b61; --line: #dfe7e2;
    --accent: #04794b; --on-accent: #ffffff; --accent-soft: #e3f2ea; --danger: #b3261e;
    --shadow: 0 1px 2px rgba(16,33,27,.06), 0 4px 14px rgba(16,33,27,.06);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1612; --surface: #16211b; --fg: #e6efe9; --muted: #93a79b; --line: #26352c; --accent: #3fbf7f; --on-accent: #06150d; --accent-soft: #1b3326; --danger: #f2867d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
  [hidden] { display: none !important; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: var(--font-display); font-size: 28px; margin: 0; line-height: 1.15; }
  .brand { font-family: var(--font-display); font-weight: 700; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
  .photo { width: 100%; height: auto; border-radius: 12px; display: block; background: var(--line); }
  .btn { min-height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn:disabled { opacity: .6; cursor: default; }
  .hint { color: var(--muted); font-size: 15px; margin: 0; }
  .err { color: var(--danger); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand">Australian Martial Arts</div>
    <p id="loading" class="hint">Loading…</p>
    <div id="info" hidden style="display:flex;flex-direction:column;gap:14px">
      <h1 id="title"></h1>
      <p class="hint" id="sub"></p>
      <img id="img" class="photo" alt="" hidden>
      <button class="btn" id="save" hidden>Save photo</button>
      <p class="hint" id="tip" hidden>On a phone, you can also press and hold the photo to save it. Please save it now: grading photos are removed 30 days after they're taken.</p>
    </div>
    <p class="err" id="error" hidden></p>
  </div>
</main>
<script>
// A family's grading photo from the Grandmaster photo text: /p#<code> (sent here as photo/#c=<code>), or photo/#t=<token>
const CFG = window.TOOLKIT_CONFIG || {};
const $ = s => document.querySelector(s);
// The short code from theggatonklenner.github.io/p#<code> (c=), or the entry's full code (t=)
const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
const token = hp.get('t') || '', code = hp.get('c') || '';
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
async function call() {
  try {
    const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/cb', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY }, body: JSON.stringify({ action: 'photo', ...(code ? { code } : { token }) }) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'Something went wrong. Please try again.' }; }
}
let photo = null;
function show(r) {
  $('#loading').hidden = true;
  if (!r.first) { $('#error').textContent = r.error || 'This link isn\'t valid. Ask the front desk for a new one.'; $('#error').hidden = false; return; }
  photo = r;
  $('#info').hidden = false;
  $('#title').textContent = `${r.first}'s grading photo`;
  $('#sub').textContent = [r.belt_to ? `Congratulations on your ${r.belt_to}!` : '', r.date ? `AMA ${r.school || ''}, ${fmtDate(r.date)}` : ''].filter(Boolean).join(' ');
  if (r.photo) {
    $('#img').src = r.url; $('#img').alt = `${r.first} with the Grandmaster`; $('#img').hidden = false;
    $('#save').hidden = false; $('#tip').hidden = false;
  }
  if (r.error) { $('#error').textContent = r.error; $('#error').hidden = false; }
}
// Save: the share sheet on phones (Save Image puts it in Photos); a download everywhere else
$('#save').onclick = async () => {
  if (!photo) return;
  $('#save').disabled = true;
  try {
    if (navigator.canShare) {
      const blob = await (await fetch(photo.url)).blob();
      const file = new File([blob], photo.filename || 'AMA-grading.jpg', { type: blob.type || 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: `${photo.first}'s grading photo` }); return; }
    }
    location.href = photo.download;
  } catch (e) { if (e && e.name !== 'AbortError') location.href = photo.download; }
  finally { $('#save').disabled = false; }
};
(async () => { if (!token && !code) return show({ error: 'This link is missing its code. Open it from the text message you were sent.' }); show(await call()); })();
</script>
</body>
</html>
