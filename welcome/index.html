<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1713">
<title>Welcome to AMA</title>
<meta name="description" content="Grading tools for AMA Marrickville, made by Tate Heggatonklenner.">
<link rel="icon" href="../icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="../icons/ama-id-cards.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<style>
  /* Same look as AMA Gradings: pine black, gold for the one thing to press, green for done */
  :root {
    --bg: #0f1713; --surface: #15201a; --raise: #1b2821; --fg: #edf2ee; --muted: #a3b5a9; --faint: #74897b; --line: #253629; --line2: #31473a;
    --accent: #f5c518; --on-accent: #14130a; --accent-soft: rgba(245,197,24,.12); --gold: #f5c518; --on-gold: #14130a;
    --ok: #7fd6a2; --danger: #ef8a73; --warn: #f0b45a; --hover: #1b2821;
    --shadow: 0 0 0 1px var(--line);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: Barlow, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .appbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
  .appbar-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 34px; height: 34px; border-radius: 8px; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .01em; white-space: nowrap; }

  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  .intro { font-size: 14px; color: var(--muted); margin: 0; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 10px 0 0; letter-spacing: .01em; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .list li + li { border-top: 1px solid var(--line); }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: inherit; text-decoration: none; min-height: 68px; }
  .item:hover { background: var(--hover); }
  .item img, .item .glyph { width: 48px; height: 48px; border-radius: 8px; flex: none; }
  .item .glyph { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .item .name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item .chev { color: var(--muted); font-size: 22px; flex: none; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--gold); color: var(--on-gold); white-space: nowrap; }
  footer { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .appbar-inner .grow { flex: 1; }
  .who { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .btn { font: inherit; font-weight: 600; white-space: nowrap; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; text-decoration: underline; align-self: flex-start; }
  .card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 14px; font-weight: 600; }
  input[type=email], input[type=password] { font: inherit; width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); color: var(--fg); }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .msg { font-size: 14px; margin: 0; }
  .msg.bad { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><img src="../icons/ama-id-cards.png" alt=""><h1>AMA Toolkit</h1></div>
  </div>
</header>
<main>
  <section id="setPw" class="card" hidden>
    <h2 style="margin:0">Choose your password</h2>
    <p class="hint" id="spFor"></p>
    <form id="spForm" style="display:flex;flex-direction:column;gap:12px">
      <input type="email" id="spEmail" autocomplete="username" hidden>
      <div class="field"><label for="spPass">New password</label><input type="password" id="spPass" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="spPass2">Type it again</label><input type="password" id="spPass2" autocomplete="new-password" minlength="8" required></div>
      <p class="hint">At least 8 characters.</p>
      <p class="msg bad" id="spMsg" hidden></p>
      <button class="btn primary" id="spGo" type="submit">Save password</button>
    </form>
  </section>
  <section id="done" class="card" hidden>
    <h2 style="margin:0">You're all set</h2>
    <p class="msg" id="doneText"></p>
    <a class="btn primary" href="../" style="text-align:center;text-decoration:none">Open your apps</a>
  </section>
  <section id="problem" class="card" hidden>
    <h2 style="margin:0">This link has run out</h2>
    <p class="msg" id="probText">Set-up links only work once, and for a limited time. Ask the person who added you to make a new one.</p>
    <a class="btn" href="../" style="text-align:center;text-decoration:none">Go to the sign-in page</a>
  </section>
  <p class="hint" id="loading">Checking your link...</p>
  <footer>AMA Marrickville</footer>
</main>
<script>
// A set-up link from Staff logins opens here: #token_hash=...&type=invite (new login) or type=recovery (new link
// for an existing login). The one-time code signs them in, then they choose a password.
const CFG = window.TOOLKIT_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const hash = new URLSearchParams(location.hash.replace(/^#/, '')), query = new URLSearchParams(location.search);
const linkError = hash.get('error_description') || query.get('error_description');
const show = id => { ['#setPw', '#done', '#problem'].forEach(x => $(x).hidden = x !== id); $('#loading').hidden = true; };
let shown = false;
async function useCode() {
  const th = hash.get('token_hash'), type = hash.get('type');
  if (!th) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ }   // the code out of the address bar
  const { error } = await sb.auth.verifyOtp({ token_hash: th, type: type === 'recovery' ? 'recovery' : 'invite' });
  if (error) { shown = true; show('#problem'); }
}
async function check() {
  if (shown) return;
  if (linkError) { shown = true; show('#problem'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  shown = true;
  const apps = (session.user.user_metadata || {}).apps;
  $('#spEmail').value = session.user.email;
  $('#spFor').textContent = `For ${session.user.email}.${apps ? ' You can use ' + apps + '.' : ''}`;
  show('#setPw'); $('#spPass').focus();
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ }   // the link's tokens out of the address bar
}
const hadLink = !!location.hash;
// Use the link's code first, so an already signed-in person opening a used link is told it has run out
const codeDone = useCode().catch(() => {});
sb.auth.onAuthStateChange(() => { codeDone.then(() => setTimeout(check, 0)); });   // not returned: supabase-js waits for it
codeDone.then(check);
setTimeout(() => { if (!shown) { show('#problem'); if (!hadLink) $('#probText').textContent = 'Open this page from the set-up link you were sent.'; } }, 6000);
$('#spForm').onsubmit = async e => {
  e.preventDefault(); $('#spMsg').hidden = true;
  const a = $('#spPass').value, b = $('#spPass2').value;
  if (a.length < 8) { $('#spMsg').textContent = 'The password needs at least 8 characters.'; $('#spMsg').hidden = false; return; }
  if (a !== b) { $('#spMsg').textContent = "The two passwords don't match."; $('#spMsg').hidden = false; return; }
  $('#spGo').disabled = true;
  const { error } = await sb.auth.updateUser({ password: a, data: { setup_pending: false, setup_at: new Date().toISOString() } });   // Staff logins then shows "Set up"
  $('#spGo').disabled = false;
  if (error) { $('#spMsg').textContent = /different from the old/i.test(error.message) ? 'Choose a password different from your old one.' : error.message; $('#spMsg').hidden = false; return; }
  $('#doneText').textContent = `Your password is saved. Sign in with ${$('#spEmail').value} and this password on any AMA app.`;
  show('#done');
};
</script>
</body>
</html>
