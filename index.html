<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04794b">
<title>AMA Toolkit</title>
<meta name="description" content="Grading tools for AMA Marrickville, made by Tate Heggatonklenner.">
<link rel="icon" href="icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="icons/ama-id-cards.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="hub-signin.js"></script>
<style>
  /* Same look as AMA ID Cards: app bar, cards with soft shadows, colours from the AMA academy logo */
  :root {
    --bg: #f3f6f4; --surface: #ffffff; --fg: #16211b; --muted: #5a6b61; --line: #dfe7e2;
    --accent: #04794b; --on-accent: #ffffff; --accent-soft: #e3f2ea; --gold: #f2d500; --on-gold: #1d1d1d; --hover: #eef5f1;
    --shadow: 0 1px 2px rgba(16,33,27,.06), 0 4px 14px rgba(16,33,27,.06);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1612; --surface: #16211b; --fg: #e6efe9; --muted: #93a79b; --line: #26352c;
      --accent: #3fbf7f; --on-accent: #06150d; --accent-soft: #1b3326; --gold: #e8d23a; --on-gold: #1d1d1d; --hover: #1c2b23;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .appbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
  .appbar-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 34px; height: 34px; border-radius: 8px; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .01em; white-space: nowrap; }

  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  .intro { font-size: 14px; color: var(--muted); margin: 0; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 10px 0 0; letter-spacing: .01em; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .list li + li { border-top: 1px solid var(--line); }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: inherit; text-decoration: none; min-height: 68px; }
  .item:hover { background: var(--hover); }
  .item img, .item .glyph { width: 48px; height: 48px; border-radius: 8px; flex: none; }
  .item .glyph { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .item .name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item .chev { color: var(--muted); font-size: 22px; flex: none; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--gold); color: var(--on-gold); white-space: nowrap; }
  footer { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .appbar-inner .grow { flex: 1; }
  .who { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .btn { font: inherit; font-weight: 600; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; text-decoration: underline; align-self: flex-start; }
  .card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 14px; font-weight: 600; }
  input[type=email], input[type=password] { font: inherit; width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .msg { font-size: 14px; margin: 0; }
  .msg.bad { color: #b3261e; }
  @media (prefers-color-scheme: dark) { .msg.bad { color: #ff8a80; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><img src="icons/ama-id-cards.png" alt=""><h1>AMA Toolkit</h1></div>
    <span class="grow"></span><span class="who" id="who" hidden></span><button class="btn" id="signOut" hidden>Sign out</button>
  </div>
</header>

<main>
  <p class="intro" id="intro">Apps for AMA Marrickville.</p>

  <section id="signIn" class="card" hidden>
    <h2 style="margin:0">Sign in</h2>
    <p class="hint">Sign in with your AMA login to see the apps you can use.</p>
    <form id="siForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="siEmail">Email</label><input type="email" id="siEmail" autocomplete="username" required></div>
      <div class="field"><label for="siPass">Password</label><input type="password" id="siPass" autocomplete="current-password" required></div>
      <p class="msg bad" id="siMsg" hidden></p>
      <button class="btn primary" id="siGo" type="submit">Sign in</button>
    </form>
    <button class="btn link" id="forgot" type="button">Forgot your password?</button>
  </section>

  <div id="apps" hidden></div>
  <p class="hint" id="loading">Loading...</p>

  <footer>Made by Tate Heggatonklenner</footer>
</main>
<script>
// Shows only the apps the signed-in person can use. (Each app checks permissions itself as well;
// this just keeps the page tidy.) The sign-in is shared with every app on this site.
const CFG = window.TOOLKIT_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
// Sign in with the AMA Admin Hub mobile and PIN (hub-signin.js)
const HUB = { sb, url: CFG.SUPABASE_URL, key: CFG.SUPABASE_KEY, form: '#siForm' };
if (window.AmaHub) { AmaHub.mount(HUB); AmaHub.recheck(HUB); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ICON = {
  tv: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  tablet: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/>',
  remote: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 8l-1.5 2 1.5 2M14 8l1.5 2-1.5 2"/><path d="M11 18h2"/>',
  play: '<polygon points="8 5 19 12 8 19 8 5"/>',
  staff: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/>',
  belt: '<path d="M3 10h18v4H3z"/><path d="M10 14l-2 6M14 14l2 6"/><rect x="10" y="9" width="4" height="6" rx="1"/>',
  db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'
};
// soon: a placeholder for a tool still being built (not a link)
const item = a => a.soon ? `<li><div class="item" aria-disabled="true" style="opacity:.6;cursor:default">
  <span class="glyph" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[a.icon]}</svg></span>
  <div class="main"><div class="name">${esc(a.name)}<span class="chip">Coming soon</span></div><div class="meta">${esc(a.meta)}</div></div></div></li>` : `<li><a class="item" href="${a.href}"${a.ext ? ' target="_blank" rel="noopener"' : ''}>
  ${a.img ? `<img src="${a.img}" alt="">` : `<span class="glyph" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[a.icon]}</svg></span>`}
  <div class="main"><div class="name">${esc(a.name)}${a.chip ? `<span class="chip">${esc(a.chip)}</span>` : ''}</div><div class="meta">${esc(a.meta)}</div></div>
  <span class="chev" aria-hidden="true">›</span></a></li>`;

async function access() {
  const rpc = async (fn, args) => { try { const { data, error } = await sb.rpc(fn, args); return error ? null : data; } catch (e) { return null; } };
  const [card, prep, edit, party, remote] = await Promise.all([rpc('my_permissions'), rpc('prep_my_roles'), rpc('tv_can', { p_perm: 'edit' }), rpc('tv_can', { p_perm: 'party' }), rpc('tv_can', { p_perm: 'remote' })]);
  return { card: card || [], prep: prep || [], edit: !!edit, party: !!party || !!edit, remote: !!remote || !!edit };
}
function draw(a) {
  const admin = a.card.includes('admin') && a.prep.includes('admin');
  const tvAny = a.edit || a.party || a.remote;
  const groups = [
    ['Black Belt Grading Tools', [
      a.prep.length && { href: 'https://theggatonklenner.github.io/Black-belt-prep-system/', img: 'icons/black-belt-prep.png', name: 'Black Belt Prep', meta: 'Preparation cycles, attendance, payments, grading and certificates' },
      a.card.length && { href: 'https://theggatonklenner.github.io/ama-id-cards/', img: 'icons/ama-id-cards.png', name: 'AMA ID Cards', meta: 'Make, approve and print member ID cards' }]],
    ['Coloured Belt Grading', [
      ['admin', 'instructor', 'grading', 'payments'].some(r => a.prep.includes(r)) && { href: 'grading/coloured-belts/', icon: 'belt', name: 'Coloured Belt Grading', meta: "Who's ready, grading days, bookings, results and certificates (White to Red Three)" }]],
    ['Dojang TV', [
      a.party && { href: 'tv/edit/', icon: 'tv', name: a.edit ? 'TV Display' : 'TV party mode', meta: a.edit ? 'Change the photos, videos and notices on the dojang TV' : 'Birthday posters and messages on the dojang TV' },
      a.party && { href: 'tv/edit/?display=tablet', icon: 'tablet', name: a.edit ? 'Tablet Display' : 'Tablet party mode', meta: a.edit ? 'Slides for the upright tablets, with a link that just works' : 'Birthday posters and messages on the tablets' },
      a.remote && { href: 'tv/remote/', icon: 'remote', name: 'TV Remote', meta: 'Next, Back, Pause and show any slide from your phone' },
      tvAny && { href: 'tv/', icon: 'play', name: 'Play on this screen', meta: "Open on the TV's browser to show the slideshow" }]],
    ['Personal', [admin && { href: 'https://theggatonklenner.github.io/clipboard/', img: 'icons/clipboard.png', name: 'Clipboard', meta: 'Text templates you copy with one tap' }]],
    ['Admin', [
      admin && { href: 'staff/', icon: 'staff', name: 'Staff logins', chip: 'Admin', meta: 'Add logins, set passwords and roles for every app' },
      admin && { href: 'https://supabase.com/dashboard/project/ptdrcxngaptcgswfbjhg', ext: true, icon: 'db', name: 'Supabase', chip: 'Admin', meta: 'Database, logins, SQL updates and backups' }]]
  ].map(([h, l]) => [h, l.filter(Boolean)]).filter(([, l]) => l.length);
  $('#apps').innerHTML = groups.length ? groups.map(([h, l]) => `<h2>${esc(h)}</h2><ul class="list">${l.map(item).join('')}</ul>`).join('')
    : '<div class="card"><p class="msg">Your login doesn\'t have access to any apps yet. Ask an admin to give you permissions in Staff logins.</p></div>';
  $('#apps').style.cssText = 'display:flex;flex-direction:column;gap:14px';
}
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  $('#loading').hidden = true;
  if (!session) { $('#signIn').hidden = false; $('#apps').hidden = true; $('#who').hidden = $('#signOut').hidden = true; $('#intro').textContent = 'Apps for AMA Marrickville.'; return; }
  $('#signIn').hidden = true;
  $('#who').textContent = (session.user.user_metadata || {}).full_name || session.user.email; $('#who').hidden = $('#signOut').hidden = false;
  $('#intro').textContent = 'Apps for AMA Marrickville. Showing the ones your login can use.';
  draw(await access()); $('#apps').hidden = false;
}
$('#siForm').onsubmit = async e => {
  e.preventDefault(); $('#siGo').disabled = true; $('#siMsg').hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#siEmail').value.trim(), password: $('#siPass').value });
  $('#siGo').disabled = false;
  if (error) { $('#siMsg').textContent = /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message; $('#siMsg').hidden = false; return; }
  start();
};
$('#forgot').onclick = () => { $('#siMsg').textContent = 'Ask an admin for a new set-up link. It lets you choose a new password.'; $('#siMsg').className = 'msg'; $('#siMsg').hidden = false; };
$('#signOut').onclick = async () => { await sb.auth.signOut(); start(); };
start();
</script>
</body>
</html>
