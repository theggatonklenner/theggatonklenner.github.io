<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04794b">
<title>Staff Logins</title>
<link rel="icon" href="../icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="../icons/ama-id-cards.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  /* Same look as AMA ID Cards */
  :root {
    --bg: #f3f6f4; --surface: #ffffff; --fg: #16211b; --muted: #5a6b61; --line: #dfe7e2;
    --accent: #04794b; --on-accent: #ffffff; --accent-soft: #e3f2ea; --gold: #f2d500; --on-gold: #1d1d1d;
    --danger: #b3261e; --warn: #a35d00; --hover: #eef5f1;
    --shadow: 0 1px 2px rgba(16,33,27,.06), 0 4px 14px rgba(16,33,27,.06);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1612; --surface: #16211b; --fg: #e6efe9; --muted: #93a79b; --line: #26352c;
      --accent: #3fbf7f; --on-accent: #06150d; --accent-soft: #1b3326; --gold: #e8d23a; --on-gold: #1d1d1d;
      --danger: #f2867d; --warn: #f0b45a; --hover: #1c2b23;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }

  .appbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
  .appbar-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .home-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); text-decoration: none; }
  .home-btn:hover { color: var(--accent); border-color: var(--accent); }
  .home-btn svg { width: 20px; height: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; color: inherit; text-decoration: none; }
  .brand img { width: 34px; height: 34px; border-radius: 8px; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .01em; white-space: nowrap; }

  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: .01em; }
  h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
  .muted { color: var(--muted); } .small { font-size: 14px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  input[type=text], input[type=email], input[type=password], input[type=search], select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--danger); }
  .btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1 1 0; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .check { display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px; color: var(--fg); font-weight: 400; }

  .people { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .people li + li { border-top: 1px solid var(--line); }
  .person { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: none; border: 0; text-align: left; cursor: pointer; min-height: 64px; }
  .person:hover { background: var(--hover); }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .who strong { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chev { color: var(--muted); font-size: 22px; flex: none; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.warn { color: var(--warn); } .tag.muted { color: var(--muted); }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--gold); color: var(--on-gold); white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .auth { max-width: 380px; margin: 10vh auto 0; }

  dialog { border: 0; padding: 0; background: var(--surface); color: var(--fg); border-radius: 16px; width: min(560px, calc(100% - 24px)); max-height: calc(100dvh - 24px); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  @media (max-width: 600px) { dialog { margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; } }
  .dlg { padding: 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .dlg-head h3 { word-break: break-all; }
  .section { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .x { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px; }

  #toast { inset: auto; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); margin: 0; border: 0; width: max-content;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <a class="home-btn" id="homeBtn" href="https://theggatonklenner.github.io/" aria-label="Back to AMA Grading Toolkit" title="AMA Grading Toolkit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></a>
    <a class="brand" href="../"><img src="../icons/ama-id-cards.png" alt=""><h1>AMA Grading Toolkit</h1></a>
    <button class="btn sm" id="signOut" hidden>Sign out</button>
  </div>
</header>

<main>
  <a class="back" href="../">‹ Toolkit</a>

  <section id="signIn" class="auth card" hidden>
    <h2>Staff logins</h2>
    <p class="hint">Sign in with your AMA login. You need to be an admin in both AMA ID Cards and Black Belt Prep.</p>
    <form id="signInForm" class="card" style="padding:0;box-shadow:none">
      <div class="field"><label for="siEmail">Email</label><input type="email" id="siEmail" autocomplete="username" required></div>
      <div class="field"><label for="siPass">Password</label><input type="password" id="siPass" autocomplete="current-password" required></div>
      <button class="btn primary" id="siGo" type="submit">Sign in</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="view-head"><h2>Staff logins</h2><button class="btn primary sm" id="addBtn">Add login</button></div>
    <p class="hint">Logins and permissions for AMA ID Cards and Black Belt Prep. Tap someone to change their permissions, set a new password or remove their login.</p>
    <input type="search" id="search" placeholder="Search email" aria-label="Search email" style="margin:12px 0">
    <ul class="people" id="list"></ul>
    <p class="hint" id="count" style="margin-top:8px"></p>
  </section>

  <section id="problem" class="card" hidden></section>
</main>

<dialog id="dlg"></dialog>
<div id="toast" role="status" popover="manual" hidden></div>

<script>
const SUPABASE_URL = 'https://ptdrcxngaptcgswfbjhg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YsRY6SlgR7U_ohn_xxQD1A_lrowkIGS'; // public by design; the function checks who is signed in
const FN = SUPABASE_URL + '/functions/v1/staff';
const CARD = { admin: 'Admin', edit: 'Edit people', delete: 'Delete people', send: 'Send to print', approve: 'Approve prints', viewer: 'View only', printer: 'Print station' };
const PREP = { admin: 'Admin', instructor: 'Instructor', attendance: 'Attendance', payments: 'Payments', grading: 'Grading', certificates: 'Certificates', idcards: 'ID cards', viewer: 'Viewer' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const dlg = $('#dlg');
let state = { me: null, users: [] }, toastTimer;

function toast(msg, ms = 4000) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
  try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch (e) { /* older browsers */ }
  toastTimer = setTimeout(() => { t.hidden = true; try { t.hidePopover(); } catch (e) { /* ignore */ } }, ms);
}
function show(id) { ['#signIn', '#app', '#problem'].forEach(s => $(s).hidden = s !== id); $('#signOut').hidden = id === '#signIn'; }
function openDlg(html) { dlg.innerHTML = html; dlg.querySelectorAll('[data-close]').forEach(b => { b.type = 'button'; b.onclick = e => { e.preventDefault(); dlg.close(); }; }); if (!dlg.open) dlg.showModal(); const t = $('#toast'); if (!t.hidden) { try { t.hidePopover(); t.showPopover(); } catch (e) { /* ignore */ } } }
function confirmBox(text, yes, danger) {
  return new Promise(res => {
    openDlg(`<div class="dlg"><h3>Are you sure?</h3><p style="margin:0">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cfNo">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cfYes">${esc(yes)}</button></div></div>`);
    $('#cfNo').onclick = () => { dlg.close(); res(false); }; $('#cfYes').onclick = () => { dlg.close(); res(true); };
  });
}

async function api(body) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Sign in first.');
  let res;
  try {
    res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_KEY }, body: JSON.stringify(body) });
  } catch (e) { const er = new Error('Could not reach the staff function. Check your connection, and that the "staff" function is deployed in Supabase.'); er.setup = true; throw er; }
  const data = await res.json().catch(() => ({}));
  if (res.status === 404 && !data.error) { const er = new Error('The "staff" function is not set up in Supabase yet.'); er.setup = true; throw er; }
  if (!res.ok) { const er = new Error(data.error || data.message || 'Something went wrong.'); er.status = res.status; throw er; }
  return data;
}

const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const listText = (roles, names) => roles.length ? (roles.includes('admin') ? 'Admin' : roles.map(r => names[r] || r).join(', ')) : 'No access';

async function load() {
  try {
    const d = await api({ action: 'list' });
    if (!Array.isArray(d.card_perms)) { const er = new Error('The "staff" function in Supabase is an older copy. Update it with the latest supabase/functions/staff/index.ts.'); er.setup = true; er.outdated = true; throw er; }
    state.me = d.me; state.users = d.users.map(u => ({ ...u, card_perms: u.card_perms || [], prep_roles: u.prep_roles || [] }));
    show('#app'); draw();
  } catch (e) {
    show('#problem');
    $('#problem').innerHTML = e.outdated
      ? `<h2>Update needed</h2><p class="hint">${esc(e.message)}</p><p class="hint">In Supabase: Edge Functions &gt; <b>staff</b> &gt; Code. Replace everything with the whole of <code>supabase/functions/staff/index.ts</code> from the theggatonklenner.github.io repository, and Deploy. Check "Verify JWT with legacy secret" is still off.</p><div class="row"><button class="btn" id="retry">Try again</button></div>`
      : e.setup
      ? `<h2>Set up needed</h2><p class="hint">${esc(e.message)}</p><p class="hint">In Supabase: Edge Functions &gt; Deploy a new function &gt; Via Editor. Name it <b>staff</b>, paste the whole of <code>supabase/functions/staff/index.ts</code> from the theggatonklenner.github.io repository, and Deploy. Then turn off "Verify JWT with legacy secret" for it.</p><div class="row"><button class="btn" id="retry">Try again</button></div>`
      : `<h2>Can't open staff logins</h2><p class="hint">${esc(e.message)}</p><div class="row"><button class="btn" id="retry">Try again</button></div>`;
    $('#retry').onclick = load;
  }
}

function draw() {
  const q = $('#search').value.trim().toLowerCase();
  const rows = state.users.filter(u => !q || u.email.includes(q));
  $('#list').innerHTML = rows.length ? rows.map(u => `<li><button class="person" data-email="${esc(u.email)}">
      <div class="who"><strong>${esc(u.email)}</strong>
        <span class="meta">${u.card_perms.includes('admin') && u.prep_roles.includes('admin') ? '<span class="chip">Admin</span>' : ''}
          <span>ID Cards: ${esc(listText(u.card_perms, CARD))}</span><span>·</span><span>Prep: ${esc(listText(u.prep_roles, PREP))}</span>
          ${!u.has_login ? '<span class="tag warn">No login yet</span>' : !u.last_sign_in_at ? '<span class="tag muted">Never signed in</span>' : ''}
          ${u.email === state.me ? '<span class="tag muted">You</span>' : ''}</span></div>
      <span class="chev" aria-hidden="true">›</span></button></li>`).join('')
    : `<li class="empty">${state.users.length ? 'No one matches.' : 'No logins yet.'}</li>`;
  $('#count').textContent = `${state.users.length} login${state.users.length === 1 ? '' : 's'}`;
  document.querySelectorAll('#list [data-email]').forEach(b => b.onclick = () => openPerson(b.dataset.email));
}

const checks = (id, names, cur) => `<div class="checks" id="${id}">${Object.entries(names).map(([k, t]) => `<label class="check"><input type="checkbox" value="${k}"${cur.includes(k) ? ' checked' : ''}> ${t}</label>`).join('')}</div>`;
const picked = id => [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
const makePassword = () => { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = crypto.getRandomValues(new Uint32Array(12)); return Array.from(r, n => a[n % a.length]).join(''); };
const ROLE_HELP = '<p class="hint">Admin can do everything in that app. Tick only what each person needs; with no ticks they can\'t use that app. Print station is only for the printer laptop\'s login.</p>';

function openPerson(email) {
  const u = state.users.find(x => x.email === email); if (!u) return;
  const self = email === state.me;
  openDlg(`<div class="dlg">
    <div class="dlg-head"><div><h3>${esc(u.email)}</h3><p class="hint">${u.has_login ? `Added ${fmtDate(u.created_at)} · ${u.last_sign_in_at ? 'last signed in ' + fmtDate(u.last_sign_in_at) : 'never signed in'}` : 'Has roles but no login yet'}</p></div><button class="x" data-close>Close</button></div>
    <form id="rolesForm" class="section" style="border-top:0;padding-top:0">
      <h3>Permissions</h3>
      <div class="field"><span class="label">AMA ID Cards</span>${checks('cardChecks', CARD, u.card_perms)}</div>
      <div class="field"><span class="label">Black Belt Prep</span>${checks('prepChecks', PREP, u.prep_roles)}</div>
      ${self ? '<p class="hint">You can\'t remove your own admin access.</p>' : ROLE_HELP}
      <div class="row"><button class="btn primary" id="saveRoles" type="submit">Save permissions</button></div>
    </form>
    ${u.has_login ? `<form id="pwForm" class="section"><h3>New password</h3>
      <div class="row"><input type="text" id="newPw" class="grow" autocomplete="new-password" placeholder="At least 8 characters" aria-label="New password" style="flex:1 1 180px;width:auto"><button type="button" class="btn sm" id="genPw">Make one</button></div>
      <p class="hint">Give the new password to them in person. They can keep using it.</p>
      <div class="row"><button class="btn" id="savePw" type="submit">Set password</button></div></form>` : `<div class="section"><p class="hint">To give them a login, use Add login with this email.</p></div>`}
    ${!self ? `<div class="section"><div class="row"><button class="btn danger" id="removeBtn">${u.has_login ? 'Remove login' : 'Remove roles'}</button></div><p class="hint">Removes their access to both apps. Their name stays on anything they did.</p></div>` : ''}
  </div>`);
  $('#rolesForm').onsubmit = async e => {
    e.preventDefault(); $('#saveRoles').disabled = true;
    try { await api({ action: 'roles', email, card_perms: picked('cardChecks'), prep_roles: picked('prepChecks') }); dlg.close(); toast('Permissions saved'); await load(); }
    catch (er) { toast(er.message, 7000); $('#saveRoles').disabled = false; }
  };
  const pw = $('#pwForm');
  if (pw) {
    $('#genPw').onclick = () => { $('#newPw').value = makePassword(); };
    pw.onsubmit = async e => {
      e.preventDefault(); const p = $('#newPw').value;
      if (p.length < 8) return toast('The password needs at least 8 characters.');
      $('#savePw').disabled = true;
      try { await api({ action: 'password', email, password: p }); toast(`Password set for ${email}`); $('#savePw').disabled = false; }
      catch (er) { toast(er.message, 7000); $('#savePw').disabled = false; }
    };
  }
  const rm = $('#removeBtn');
  if (rm) rm.onclick = async () => {
    if (!await confirmBox(`Remove ${email}? They will no longer be able to sign in to AMA ID Cards or Black Belt Prep.`, 'Remove', true)) return openPerson(email);
    try { await api({ action: 'remove', email }); toast(`${email} removed`); await load(); }
    catch (er) { toast(er.message, 7000); openPerson(email); }
  };
}

function openAdd() {
  openDlg(`<form id="addForm" class="dlg">
    <div class="dlg-head"><h3>Add login</h3><button class="x" data-close>Close</button></div>
    <div class="field"><label for="addEmail">Email</label><input type="email" id="addEmail" required autocomplete="off"></div>
    <div class="field"><label for="addPw">Starting password</label><div class="row"><input type="text" id="addPw" autocomplete="new-password" placeholder="At least 8 characters" style="flex:1 1 180px;width:auto"><button type="button" class="btn sm" id="addGen">Make one</button></div></div>
    <div class="field"><span class="label">AMA ID Cards</span>${checks('cardChecks', CARD, [])}</div>
    <div class="field"><span class="label">Black Belt Prep</span>${checks('prepChecks', PREP, [])}</div>
    ${ROLE_HELP}
    <p class="hint">If the email already has a login, its permissions are updated. Leave the password blank to keep their current one.</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="addGo" type="submit">Add login</button></div>
  </form>`);
  $('#addGen').onclick = () => { $('#addPw').value = makePassword(); };
  $('#addForm').onsubmit = async e => {
    e.preventDefault();
    const email = $('#addEmail').value.trim().toLowerCase(), password = $('#addPw').value;
    if (password && password.length < 8) return toast('The password needs at least 8 characters.');
    $('#addGo').disabled = true;
    try {
      const r = await api({ action: 'create', email, password, card_perms: picked('cardChecks'), prep_roles: picked('prepChecks') });
      dlg.close(); toast(r.existed ? `${email} already had a login; permissions updated` : `Login added for ${email}${password ? '. Give them the starting password.' : ''}`, 6000); await load();
    } catch (er) { toast(er.message, 7000); $('#addGo').disabled = false; }
  };
}

$('#search').oninput = draw;
$('#addBtn').onclick = openAdd;
$('#signOut').onclick = async () => { await sb.auth.signOut(); state = { me: null, users: [] }; show('#signIn'); };
$('#signInForm').onsubmit = async e => {
  e.preventDefault(); $('#siGo').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#siEmail').value.trim(), password: $('#siPass').value });
  $('#siGo').disabled = false;
  if (error) return toast(/invalid/i.test(error.message) ? 'Wrong email or password.' : error.message, 6000);
  $('#siPass').value = ''; load();
};
(async () => { const { data: { session } } = await sb.auth.getSession(); session ? load() : show('#signIn'); })();
</script>
</body>
</html>
