<!-- Supabase > Authentication > Emails > Templates > Reset password. Subject: AMA: choose a new password -->
<div style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #16211b; max-width: 520px; margin: 0 auto; padding: 24px;">
  <img src="https://theggatonklenner.github.io/icons/ama-id-cards.png" alt="AMA" width="48" height="48" style="border-radius: 8px;">
  <h1 style="font-size: 22px; margin: 16px 0 8px;">Choose a new password</h1>
  <p>Press the button to choose a new password for your AMA login, <b>{{ .Email }}</b>.</p>
  <p style="margin: 24px 0;"><a href="{{ .ConfirmationURL }}" style="background: #04794b; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 10px; font-weight: bold; display: inline-block;">Choose a new password</a></p>
  <p style="font-size: 14px; color: #5a6b61;">The button works once and only for a limited time. If you didn't ask for this, you can ignore this email; your password stays the same.</p>
</div>
